/* ==========================================================================
   CHORD DIAGRAMS  —  ukulele (gCEA). Extension point: add shapes to SHAPES.
   frets: array of 4 numbers  [g,C,E,A]  · 0 = open · -1 = muted · n = fret
   ========================================================================== */
const SHAPES = {
  "C":[0,0,0,3],"C7":[0,0,0,1],"Cmaj7":[0,0,0,2],"C6":[0,0,0,0],"Cadd9":[0,2,0,3],"Cm":[0,3,3,3],"Cm7":[3,3,3,3],
  "D":[2,2,2,0],"D7":[2,2,2,3],"Dm":[2,2,1,0],"Dm7":[2,2,1,3],"Dmaj7":[2,2,2,4],"Dsus4":[0,2,3,0],"Dsus2":[2,2,0,0],
  "E":[4,4,4,0],"E7":[1,2,0,2],"Em":[0,4,3,2],"Em7":[0,2,0,2],"Emaj7":[1,3,0,2],
  "F":[2,0,1,0],"F7":[2,3,1,0],"Fm":[1,0,1,3],"Fmaj7":[2,4,1,3],"Fm7":[1,3,1,3],
  "G":[0,2,3,2],"G7":[0,2,1,2],"Gm":[0,2,3,1],"Gmaj7":[0,2,2,2],"Gsus4":[0,2,3,3],"Gm7":[0,2,1,1],
  "A":[2,1,0,0],"A7":[0,1,0,0],"Am":[2,0,0,0],"Am7":[0,0,0,0],"Amaj7":[1,1,0,0],"Asus4":[2,2,0,0],
  "B":[4,3,2,2],"B7":[2,3,2,2],"Bm":[4,2,2,2],"Bm7":[2,2,2,2],"Bdim":[1,2,1,2],
  "Bb":[3,2,1,1],"Bb7":[1,2,1,1],"Bbm":[3,1,1,1],"A#":[3,2,1,1],
  "Eb":[3,3,3,1],"Ebmaj7":[3,3,3,0],"D#":[3,3,3,1],
  "Ab":[5,3,4,3],"G#":[5,3,4,3],"Abmaj7":[1,3,3,3],
  "Db":[1,1,1,4],"C#":[1,1,1,4],"C#m":[1,4,4,4],
  "F#":[3,1,2,1],"Gb":[3,1,2,1],"F#m":[2,1,2,0],"Gbm":[2,1,2,0],"F#m7":[2,4,2,4],
  "G#m":[4,3,4,2],"Abm":[4,3,4,2],
  "C/B":[4,0,0,3],"G6":[0,2,0,2],"Cm6":[2,3,3,3],"Bbdim":[0,1,0,1],"Adim":[2,3,2,3],"Ddim":[1,2,1,2],
  "A6":[2,4,2,4],"D6":[2,2,2,2],"E6":[1,0,2,0],"F6":[2,2,1,3],"Gadd9":[0,2,0,0],"Fadd9":[0,0,1,0],
};
function chordSVG(name){
  let frets = SHAPES[name];
  if (!frets){ // fall back: drop slash bass, then trim extensions / enharmonic
    const base = name.replace(/\/.*$/, "");                 // C/E -> C, Am/G -> Am
    const cands = [base, name.replace(/maj7/,"M7"), base.replace(/maj7/,"M7"),
                   name.replace(/7$/,""), base.replace(/(sus[24]|add\d|dim|aug|maj7|M7|[469]|7)$/,""),
                   base.replace(/m$/,"")];
    for (const c of cands){ if (c && SHAPES[c]){ frets = SHAPES[c]; break; } }
    if (!frets) return null;
  }
  const W=110, H=120, L=16, T=22, cw=(W-L*2)/3, rows=4, rh=(H-T-14)/rows;
  let p = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(name)} chord diagram">`;
  p += `<rect x="${L}" y="${T}" width="${cw*3}" height="4" rx="1" fill="var(--ink)"/>`;
  for (let i=0;i<4;i++) p += `<line x1="${L+cw*i}" y1="${T}" x2="${L+cw*i}" y2="${T+rh*rows}" stroke="var(--line)" stroke-width="1.4"/>`;
  for (let r=0;r<=rows;r++) p += `<line x1="${L}" y1="${T+rh*r}" x2="${L+cw*3}" y2="${T+rh*r}" stroke="var(--line)" stroke-width="1.4"/>`;
  frets.forEach((f,i) => {
    const x = L + cw*i;
    if (f === -1){ p += `<text x="${x}" y="${T-6}" text-anchor="middle" font-size="11" fill="var(--muted)">×</text>`; }
    else if (f === 0){ p += `<circle cx="${x}" cy="${T-9}" r="4" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`; }
    else { p += `<circle cx="${x}" cy="${T + rh*(f-0.5)}" r="7" fill="var(--accent)"/>`; }
  });
  p += `</svg>`;
  return p;
}
let _chordPop = null;
function showChordPop(name, anchor){
  closeChordPop();
  const svg = chordSVG(name);
  const pop = el("div", { class:"chordpop" },
    el("h5", {}, name),
    svg ? el("div", { html: svg }) : el("div", { class:"none" }, "No diagram yet — add one in SHAPES."));
  document.body.append(pop);
  const r = anchor.getBoundingClientRect();
  const px = Math.min(window.innerWidth - pop.offsetWidth - 10, Math.max(10, r.left + r.width/2 - pop.offsetWidth/2));
  let py = r.bottom + window.scrollY + 8;
  if (r.bottom + pop.offsetHeight + 16 > window.innerHeight) py = r.top + window.scrollY - pop.offsetHeight - 8;
  pop.style.left = px + "px"; pop.style.top = py + "px";
  _chordPop = pop;
  setTimeout(() => document.addEventListener("click", onDocClick, { once:true }), 0);
  function onDocClick(e){ if (!pop.contains(e.target)) closeChordPop(); }
}
function closeChordPop(){ if (_chordPop){ _chordPop.remove(); _chordPop = null; } }
window.addEventListener("scroll", closeChordPop, { passive:true });

/* ==========================================================================
   FORMS  —  Add / Edit song.  Modal, every field editable, delete w/ confirm.
   ========================================================================== */
function modal({ title, body, footer, wide }){
  const root = $("#modal-root");
  const overlay = el("div", { class:"overlay", onclick:e => { if (e.target === overlay) close(); } });
  const box = el("div", { class:"modal" + (wide ? " wide":""), role:"dialog", "aria-modal":"true", "aria-label":title });
  box.append(
    el("div", { class:"modal-head" }, el("h3", {}, title),
      el("button", { class:"close-x", "aria-label":"Close", onclick:() => close(),
        html:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>' })),
    el("div", { class:"modal-body" }, body),
  );
  if (footer) box.append(el("div", { class:"modal-foot" }, footer));
  overlay.append(box);
  root.replaceChildren(overlay);
  const focusable = box.querySelector("input,select,textarea,button");
  if (focusable) focusable.focus();
  function close(){ root.replaceChildren(); }
  modal._close = close;
  return { close };
}
function closeModal(){ if (modal._close) modal._close(); }

function field(label, control, hint){
  return el("div", { class:"field" },
    el("label", {}, label, hint ? el("span", { class:"hint" }, "  — " + hint) : ""),
    control);
}
function input(value, attrs={}){ return el("input", { type:"text", value: value ?? "", ...attrs }); }

function openSongForm(existing, opts={}){
  const s = existing || {};
  const isEdit = !!existing;
  const returnTo = opts.returnTo || null;   // hash to go back to after save/cancel
  const cats = Store.getCategories();
  let chords = (s.chords || []).slice();
  let sheets = (s.sheetMusic || []).map(x => ({ ...x }));
  let status = s.status || "review";

  // -- controls
  const fTitle = input(s.title, { placeholder:"Song title", required:true });
  const fArtist = input(s.artist, { placeholder:"Artist" });
  const fCat = el("select", {});
  cats.forEach(c => fCat.append(el("option", { value:c, selected:c===s.category }, c)));
  fCat.append(el("option", { value:"__new" }, "+ New category…"));
  fCat.addEventListener("change", () => { if (fCat.value === "__new"){ const n = prompt("New category name"); if (n){ Store.addCategory(n);
    fCat.replaceChildren(); Store.getCategories().forEach(c => fCat.append(el("option",{value:c,selected:c===n},c)));
    fCat.append(el("option",{value:"__new"},"+ New category…")); } else fCat.value = s.category || cats[0]; } });
  const fSub = input(s.subcategory, { placeholder:"e.g. Fado, Campfire" });
  const fLang = input(s.language, { placeholder:"English, Portuguese…" });
  const fDiff = el("select", {});
  [["","—"],["Beginner","Beginner"],["Intermediate","Intermediate"],["Advanced","Advanced"]]
    .forEach(([v,l]) => fDiff.append(el("option", { value:v, selected:v===(s.difficulty||"") }, l)));
  const fInstr = input(s.instrument || "Ukulele");
  const fKey = input(s.key, { placeholder:"C, Am…" });
  const fCapo = el("input", { type:"number", min:"0", max:"12", value: s.capo || 0 });
  const fTuning = input(s.tuning || "gCEA");
  const fTags = input((s.tags || []).join(", "), { placeholder:"comma, separated, tags" });
  const fLyrics = el("textarea", { placeholder:"Plain lyrics (no chords)" }, s.lyrics || "");
  const fLWC = el("textarea", { placeholder:"[C]Now I've heard there was a [Am]secret chord", style:"min-height:170px" }, s.lyricsWithChords || "");
  const fNotes = el("textarea", { placeholder:"Strumming pattern, reminders, where you learnt it…", style:"font-family:var(--sans)" }, s.notes || "");
  const fFav = el("input", { type:"checkbox", checked: !!s.favorite });

  // chord pill editor
  const chordBox = el("div", { class:"chordedit" });
  const chordInput = el("input", { placeholder:"add chord + Enter", "aria-label":"Add chord" });
  function paintChords(){
    chordBox.replaceChildren();
    chords.forEach((c,i) => chordBox.append(el("span", { class:"pill" }, c,
      el("button", { type:"button", "aria-label":`Remove ${c}`, onclick:() => { chords.splice(i,1); paintChords(); } }, "×"))));
    chordBox.append(chordInput);
  }
  chordInput.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === ","){ e.preventDefault();
      const v = chordInput.value.trim().replace(/,$/,"");
      if (v && !chords.includes(v)){ chords.push(v); }
      chordInput.value = ""; paintChords(); chordInput.focus();
    } else if (e.key === "Backspace" && !chordInput.value && chords.length){ chords.pop(); paintChords(); }
  });
  const autoChordsBtn = el("button", { type:"button", class:"btn sm ghost",
    onclick:() => { const found = [...new Set((fLWC.value.match(/\[([^\]]+)\]/g) || [])
      .map(x => x.slice(1,-1).trim()).filter(isChord))];
      if (found.length){ chords = found; paintChords(); toast(`Found ${found.length} chords`); } else toast("No [chords] found in the chord sheet"); } },
    "Detect from chord sheet");
  paintChords();

  // sheet music rows
  const sheetWrap = el("div", { class:"sheet-rows" });
  function paintSheets(){
    sheetWrap.replaceChildren();
    sheets.forEach((sm,i) => {
      const typeSel = el("select", { onchange:e => sm.type = e.target.value });
      [["pdf","PDF"],["image","Image"]].forEach(([v,l]) => typeSel.append(el("option", { value:v, selected:v===sm.type }, l)));
      const lab = el("input", { type:"text", value: sm.label || "", placeholder:"label", oninput:e => sm.label = e.target.value });
      const src = el("input", { type:"text", value: sm.src || "", placeholder:"relative/path/to/file.pdf", oninput:e => sm.src = e.target.value });
      const pick = el("input", { type:"file", accept:".pdf,image/*", style:"display:none",
        onchange:e => { const f = e.target.files[0]; if (f){ sm.src = f.name; sm.type = /\.pdf$/i.test(f.name) ? "pdf":"image"; paintSheets(); } } });
      const pickBtn = el("button", { type:"button", class:"btn sm ghost", onclick:() => pick.click() }, "Pick");
      const del = el("button", { type:"button", "aria-label":"Remove", onclick:() => { sheets.splice(i,1); paintSheets(); } }, "Remove");
      sheetWrap.append(el("div", { class:"sheet-row" }, typeSel, lab, src, el("span",{style:"display:flex;gap:4px"}, pickBtn, del), pick));
    });
    sheetWrap.append(el("button", { type:"button", class:"btn sm", onclick:() => { sheets.push({ type:"pdf", label:"", src:"" }); paintSheets(); } }, "+ Add sheet"));
  }
  paintSheets();

  // status segmented
  const statusSeg = el("div", { class:"status-seg", role:"group", "aria-label":"Verification status" });
  [["review","⚠ Needs review"],["verified","✓ Verified"],["missing","Missing info"]].forEach(([v,l]) => {
    statusSeg.append(el("button", { type:"button", "aria-pressed": status===v ? "true":"false",
      onclick:(e) => { status = v; $$("button", statusSeg).forEach(b => b.setAttribute("aria-pressed","false")); e.currentTarget.setAttribute("aria-pressed","true"); } }, l));
  });

  const body = el("div", {},
    field("Title", fTitle),
    el("div", { class:"grid-2" }, field("Artist", fArtist), field("Category", fCat)),
    el("div", { class:"grid-3" }, field("Subcategory", fSub), field("Language", fLang), field("Difficulty", fDiff)),
    el("div", { class:"grid-3" }, field("Instrument", fInstr), field("Key", fKey), field("Capo", fCapo)),
    el("div", { class:"grid-2" }, field("Tuning", fTuning), field("Tags", fTags, "comma separated")),
    field(el("span",{}, "Chords ", autoChordsBtn), chordBox),
    field("Lyrics + Chords", fLWC, "inline [Chord] markers — this drives the aligned view & practice mode"),
    field("Plain lyrics", fLyrics, "optional — lyrics only, for search / printing"),
    field("Sheet music", sheetWrap, "PDF or image. Path is relative to index.html"),
    field("Notes", fNotes),
    el("div", { class:"field" }, el("label", {}, "Verification"), statusSeg),
    el("label", { class:"check" }, fFav, " Mark as favorite"),
  );

  const save = el("button", { class:"btn primary", onclick:() => {
    if (!fTitle.value.trim()){ fTitle.focus(); toast("A title is required"); return; }
    const data = {
      title: fTitle.value.trim(), artist: fArtist.value.trim() || "Unknown",
      category: fCat.value === "__new" ? (s.category || "Other") : fCat.value,
      subcategory: fSub.value.trim(), language: fLang.value.trim(), difficulty: fDiff.value,
      instrument: fInstr.value.trim(), key: fKey.value.trim(), capo: +fCapo.value || 0,
      tuning: fTuning.value.trim(), chords,
      lyrics: fLyrics.value, lyricsWithChords: fLWC.value,
      sheetMusic: sheets.filter(x => x.src.trim()),
      tags: fTags.value.split(",").map(t => t.trim()).filter(Boolean),
      notes: fNotes.value, favorite: fFav.checked, status, verified: status === "verified",
    };
    const saved = isEdit ? Store.updateSong(s.id, data) : Store.addSong(data);
    closeModal(); toast(isEdit ? "Song updated" : "Song added");
    if (returnTo){ if (parseHash().name + "/" + parseHash().param === returnTo.replace(/^#\//,"")) render(); else go(returnTo); }
    else { go(`#/song/${saved.id}`); render(); }
  } }, isEdit ? "Save changes" : "Add song");

  const footL = isEdit
    ? el("button", { class:"btn danger-btn", style:"margin-right:auto", onclick:() => confirmDelete(s, { returnTo }) }, "Delete song")
    : el("span", { style:"margin-right:auto" });

  modal({ title: isEdit ? "Edit song" : "Add song", wide:true, body,
    footer: [footL, el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"), save] });
}

function confirmDelete(s, opts={}){
  modal({ title:"Delete song", body: el("div", {},
      el("p", {}, "Delete ", el("b", {}, s.title), " by ", esc(s.artist), "? This can’t be undone."),
      el("p", { style:"margin-top:8px;color:var(--muted);font-size:13px" }, "Tip: keep a backup via Settings → Export Library.")),
    footer: [
      el("button", { class:"btn", onclick:() => openSongForm(s, opts) }, "Cancel"),
      el("button", { class:"btn danger-btn", onclick:() => {
        const inReview = (opts.returnTo || "").startsWith("#/review");
        Store.deleteSong(s.id); closeModal(); toast("Song deleted");
        if (inReview) Review.drop(s.id);
        else { go("#/"); render(); }
      } }, "Delete"),
    ] });
}

/* ==========================================================================
   SETTINGS  —  IMPORT / EXPORT / RESET / categories.
   ========================================================================== */
function renderSettings(root){
  destroyPractice();
  root.replaceChildren();
  root.append(el("div", { class:"song-nav" },
    el("a", { class:"back", href:"#/" },
      el("span",{html:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>'}), "Library")));
  root.append(el("h2", { style:"font-family:var(--serif);font-size:26px;margin-bottom:18px" }, "Settings & data"));

  const songs = Store.getSongs();

  // -- review queue
  const vCount = songs.filter(s => s.status === "verified").length;
  const revSec = el("div", { class:"settings-sec" });
  revSec.append(el("h3", {}, "Verification"),
    el("p", {}, `${vCount} of ${songs.length} verified · ${songs.length - vCount} still flagged. Review Mode steps through them one at a time.`));
  const revRow = el("div", { class:"row" });
  Object.entries(Review.SCOPES).forEach(([k,v]) => {
    const n = Review.count(k);
    if (!n && k !== "all") return;
    revRow.append(el("button", { class:"btn sm", onclick:() => Review.start(k) }, `${v.label} · ${n}`));
  });
  revSec.append(revRow);
  root.append(revSec);

  // -- data
  const dataSec = el("div", { class:"settings-sec" });
  dataSec.append(el("h3", {}, "Library data"),
    el("p", {}, `${songs.length} songs · ${songs.filter(s=>s.favorite).length} favorites · stored in this browser (localStorage).`));
  const dataRow = el("div", { class:"row" });
  dataRow.append(el("button", { class:"btn", onclick:exportLibrary }, "Export Library (JSON)"));
  const importInput = el("input", { type:"file", accept:"application/json,.json", style:"display:none",
    onchange:e => { const f = e.target.files[0]; if (f) importLibrary(f); e.target.value = ""; } });
  dataRow.append(el("button", { class:"btn", onclick:() => importInput.click() }, "Import Library (JSON)"), importInput);
  dataRow.append(el("button", { class:"btn danger-btn", onclick:confirmReset }, "Reset to sample data"));
  dataSec.append(dataRow);
  root.append(dataSec);

  // -- categories
  const catSec = el("div", { class:"settings-sec" });
  catSec.append(el("h3", {}, "Categories"), el("p", {}, "Used across the library and the Add / Edit form."));
  const catList = el("div", { class:"cat-list" });
  const paintCats = () => { catList.replaceChildren();
    Store.getCategories().forEach(c => {
      const inUse = songs.some(s => s.category === c);
      catList.append(el("span", { class:"pill" }, c,
        el("button", { title: inUse ? "In use — reassign those songs first" : "Remove", disabled: inUse,
          onclick:() => { Store.deleteCategory(c); paintCats(); } }, "×")));
    });
  };
  paintCats();
  const catAdd = el("input", { type:"text", placeholder:"New category", style:"padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)" });
  catAdd.addEventListener("keydown", e => { if (e.key === "Enter" && catAdd.value.trim()){ Store.addCategory(catAdd.value.trim()); catAdd.value = ""; paintCats(); } });
  catSec.append(catList, el("div", { class:"row" }, catAdd,
    el("button", { class:"btn sm", onclick:() => { if (catAdd.value.trim()){ Store.addCategory(catAdd.value.trim()); catAdd.value=""; paintCats(); } } }, "Add")));
  root.append(catSec);

  // -- unimported sources
  const srcSec = el("div", { class:"settings-sec" });
  srcSec.append(el("h3", {}, "Source files not yet imported"),
    el("p", {}, "The initial library was auto-extracted from the text-based ukulele tab PDFs in this folder. These remain as source material — they need OCR or manual entry:"));
  const ul = el("div", { class:"src-note" });
  UNIMPORTED_SOURCES.forEach(x => ul.append(el("div", { style:"margin-bottom:6px" }, el("code", {}, x.name), " — " + x.why)));
  srcSec.append(ul);
  root.append(srcSec);

  // -- shortcuts
  const kbSec = el("div", { class:"settings-sec" });
  kbSec.append(el("h3", {}, "Keyboard shortcuts"));
  const kb = el("div", { class:"src-note" });
  [["/","Focus search"],["Esc","Close dialog / leave practice or review"],
   ["← →","Prev / next — in practice mode and review mode"],
   ["G / Enter","Review: mark “looks good” and advance"],
   ["V","Review: toggle verified"],["E","Review: edit the current song"],
   ["F","Favorite the open song"]]
    .forEach(([k,d]) => kb.append(el("div", { style:"margin-bottom:5px" }, el("span", { class:"kbd" }, k), "  " + d)));
  kbSec.append(kb);
  root.append(kbSec);
}

function exportLibrary(){
  const blob = new Blob([JSON.stringify(Store.exportAll(), null, 2)], { type:"application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `my-music-${new Date().toISOString().slice(0,10)}.json` });
  document.body.append(a); a.click(); a.remove();
  toast("Library exported");
}
function importLibrary(file){
  const reader = new FileReader();
  reader.onload = () => {
    let obj; try { obj = JSON.parse(reader.result); } catch(e){ toast("That file isn’t valid JSON"); return; }
    const songs = obj.songs || (Array.isArray(obj) ? obj : null);
    if (!songs){ toast("No songs found in that file"); return; }
    modal({ title:"Import library", body: el("div", {},
        el("p", {}, `Found ${songs.length} songs in “${esc(file.name)}”.`),
        el("p", { style:"margin-top:8px;color:var(--muted);font-size:13px" }, "Merge keeps your current songs and adds/updates by id. Replace swaps everything.")),
      footer: [
        el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"),
        el("button", { class:"btn", onclick:() => { const n = Store.importAll(obj.songs?obj:{songs}, "merge"); closeModal(); toast(`Merged — ${n} songs`); render(); } }, "Merge"),
        el("button", { class:"btn primary", onclick:() => { const n = Store.importAll(obj.songs?obj:{songs}, "replace"); closeModal(); toast(`Replaced — ${n} songs`); render(); } }, "Replace all"),
      ] });
  };
  reader.readAsText(file);
}
function confirmReset(){
  modal({ title:"Reset to sample data", body:
      el("p", {}, "This replaces your current library with the ", el("b",{},String(SEED.length)), " songs extracted from your PDF collection. Export a backup first if you’ve made changes."),
    footer: [
      el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"),
      el("button", { class:"btn danger-btn", onclick:() => { Store.resetDemo(); closeModal(); toast("Library reset"); go("#/"); render(); } }, "Reset"),
    ] });
}

/* ==========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================== */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  const route = parseHash();

  if (e.key === "Escape"){
    if (_chordPop) return closeChordPop();
    if ($("#modal-root").hasChildNodes()) return closeModal();
    if (route.name === "practice") return history.length > 1 ? history.back() : go(`#/song/${route.param}`);
    if (route.name === "review") return Review.exit();
  }
  if (typing){
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  if (e.key === "/"){ e.preventDefault(); $("#search").focus(); $("#search").select(); return; }
  if ($("#modal-root").hasChildNodes()) return;

  if (route.name === "practice" && _practice){
    if (e.key === "ArrowRight"){ e.preventDefault(); _practice.step(1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); _practice.step(-1); }
    if (e.key.toLowerCase() === "f"){ Store.toggleFavorite(_practice.song.id); toast("Favorite toggled"); }
  }
  if (route.name === "song"){
    if (e.key.toLowerCase() === "f"){ Store.toggleFavorite(route.param); render(); }
  }
  if (route.name === "review"){
    if (e.key === "ArrowRight"){ e.preventDefault(); Review.next(); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); Review.prev(); }
    if (e.key === "Enter" || e.key.toLowerCase() === "g"){ e.preventDefault(); Review.markGood(); }
    if (e.key.toLowerCase() === "v"){ Review.toggleVerified(); }
    if (e.key.toLowerCase() === "e"){ const s = Store.getSong(Review.currentId()); if (s) openSongForm(s, { returnTo:`#/review/${s.id}` }); }
  }
});

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
$("#search").addEventListener("input", debounce(e => {
  State.q = e.target.value;
  if (parseHash().name !== "library"){ go("#/"); }
  else renderLibrary($("#view"));
}, 140));
$("#search").addEventListener("keydown", e => { if (e.key === "Enter" && parseHash().name !== "library") go("#/"); });
$("#add-btn").addEventListener("click", () => openSongForm(null));
$("#settings-btn").addEventListener("click", () => go("#/settings"));
$("#brand").addEventListener("click", () => go("#/"));
$("#brand").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go("#/"); } });

// first run: seed the store
if (!localStorage.getItem("music.songs.v1")){ Store.getSongs(); /* triggers normalize+persist path on next write */ }
Store.savePreferences({}); // ensure prefs object exists

render();
