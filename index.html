<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music</title>
<style>
/* ============================================================ DESIGN TOKENS */
:root{
  /* light — Apple-style: white surfaces, cool greys, system blue accent */
  --paper:#ffffff; --card:#ffffff; --card-2:#f5f5f7;
  --ink:#1d1d1f; --ink-soft:#42424a; --muted:#6e6e73; --faint:#8e8e93;
  --line:#d8d8de; --line-soft:#ececf0;
  --accent:#0071e3; --accent-hover:#0060c8; --accent-soft:#e8f1fd; --accent-ink:#0067d4;
  --ok:#1d8a3f; --ok-soft:#e4f4e8; --warn:#a15c10; --warn-soft:#fbeedd;
  --radius:18px; --radius-sm:11px;
  --shadow:0 2px 8px rgba(0,0,0,.04), 0 10px 30px -12px rgba(0,0,0,.10);
  --shadow-lg:0 18px 60px -18px rgba(0,0,0,.22);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#000000; --card:#1c1c1e; --card-2:#151517;
    --ink:#f5f5f7; --ink-soft:#c7c7cc; --muted:#98989f; --faint:#69696e;
    --line:#38383c; --line-soft:#2a2a2d;
    --accent:#2997ff; --accent-hover:#43a5ff; --accent-soft:#12324e; --accent-ink:#6cb6ff;
    --ok:#5cc273; --ok-soft:#17301c; --warn:#e0a15b; --warn-soft:#33260f;
    --shadow:0 2px 10px rgba(0,0,0,.5), 0 12px 36px -14px rgba(0,0,0,.7);
    --shadow-lg:0 20px 64px -18px rgba(0,0,0,.8);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  line-height:1.5; font-size:15px; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
h1,h2,h3{font-weight:600;letter-spacing:-.021em}

/* ============================================================ LAYOUT / CHROME */
.appbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid var(--line);
}
.appbar-in{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;flex-direction:column;line-height:1.15;flex-shrink:0;cursor:pointer}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.02em}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.appbar .spacer{flex:1}
.searchwrap{position:relative;flex:1;max-width:440px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);transition:border-color .15s,box-shadow .15s;font-size:14px;
}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;
  transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;
}
.btn:hover{background:var(--card-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--card-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.icon-btn:hover{background:var(--card-2)}
.icon-btn svg{width:17px;height:17px}

main{max-width:var(--maxw);margin:0 auto;padding:26px 20px 80px}

/* ============================================================ LIBRARY */
.lib-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.lib-head h2{font-family:var(--serif);font-size:26px}
.lib-head .count{color:var(--muted);font-size:13px}

.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;color:var(--ink-soft);transition:all .13s;display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .x{font-size:14px;line-height:1;opacity:.7}
.chip.sel-clear{color:var(--accent-ink);border-color:var(--accent-soft);background:var(--accent-soft)}

.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:22px;overflow:hidden}
.panel-head{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}
.panel-head .caret{margin-left:auto;transition:transform .18s;width:14px;height:14px}
.panel[data-open="false"] .caret{transform:rotate(-90deg)}
.panel[data-open="false"] .panel-body{display:none}
.panel-body{padding:4px 16px 16px}

.chord-grid{display:flex;flex-wrap:wrap;gap:7px}
.chord-key{
  min-width:44px;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--card);font-family:var(--mono);font-size:13px;text-align:center;transition:all .12s;
}
.chord-key:hover{border-color:var(--accent)}
.chord-key[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chord-mode{display:flex;gap:6px;margin-top:14px;align-items:center;flex-wrap:wrap}
.seg-ctrl{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg-ctrl button{padding:6px 13px;font-size:12px;color:var(--ink-soft)}
.seg-ctrl button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chord-hint{font-size:12px;color:var(--muted);margin-left:4px}

/* song cards */
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.songs.list-view{grid-template-columns:1fr}
.card{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px 19px;
  text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .16s,box-shadow .16s,transform .08s;
  position:relative;width:100%;
}
.card:hover{border-color:transparent;box-shadow:var(--shadow)}
.card:active{transform:scale(.992)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.25}
.card .artist{color:var(--ink-soft);font-size:13px;margin-top:1px}
.card .fav{flex-shrink:0;width:26px;height:26px;display:grid;place-items:center;border-radius:999px;color:var(--faint)}
.card .fav:hover{background:var(--card-2)}
.card .fav.on{color:var(--accent)}
.card-chords{display:flex;flex-wrap:wrap;gap:5px}
.pill{
  font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;
  background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line-soft);
}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:2px}
.dot{width:3px;height:3px;border-radius:999px;background:var(--faint)}
.tag-badge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;font-weight:600}
.tag-badge.review{background:var(--warn-soft);color:var(--warn)}
.tag-badge.verified{background:var(--ok-soft);color:var(--ok)}
.tag-badge.missing{background:var(--accent-soft);color:var(--accent-ink)}

.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty h3{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:6px;font-weight:600}
.empty p{font-size:14px;max-width:340px;margin:0 auto}

.toolbar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sortsel{padding:7px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);font-size:12.5px}
.viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.viewtoggle button{padding:7px 10px;display:grid;place-items:center}
.viewtoggle button svg{width:15px;height:15px}
.viewtoggle button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ============================================================ SONG VIEW */
.song-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft)}
.back:hover{color:var(--ink)}
.song-nav .spacer{flex:1}

.song-head{margin-bottom:18px}
.song-head h1{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.song-head .by{font-size:15px;color:var(--ink-soft);margin-top:4px}
.song-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.song-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.song-facts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;align-items:center}
.fact{font-size:12px;color:var(--ink-soft);background:var(--card-2);border:1px solid var(--line-soft);padding:3px 9px;border-radius:999px}
.fact.chord{font-family:var(--mono);cursor:pointer}
.fact.chord:hover{border-color:var(--accent);color:var(--accent-ink)}

.split{display:grid;gap:20px;grid-template-columns:minmax(0,1.4fr) minmax(0,320px);align-items:start}
.split.stack{grid-template-columns:1fr}
.pane{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.pane-head{
  padding:11px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--card-2)
}
.pane-head .ph-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.pane-body{padding:20px 20px 26px}
.split .chord-pane{position:sticky;top:78px;align-self:start}

/* mobile tab switch for song view */
.song-tabs{display:none;margin-bottom:16px;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.song-tabs button{flex:1;padding:9px 6px;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.song-tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ============================================================ CHORD/LYRIC RENDER */
.sheet{font-size:var(--lyric-size,16px);line-height:1.85;color:var(--ink);font-family:var(--sans)}
.sheet .sec{
  font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);
  font-weight:700;margin:1.5em 0 .55em;padding-bottom:.2em;border-bottom:1px solid var(--line-soft);
}
.sheet .sec:first-child{margin-top:0}
.sheet .line{display:flex;flex-wrap:wrap;align-items:flex-end;margin:.15em 0;min-height:1em}
.sheet .line.blank{height:.9em}
.sheet .seg{display:inline-flex;flex-direction:column;justify-content:flex-end}
.sheet .chd{
  font-family:var(--mono);font-size:.74em;font-weight:600;line-height:1.4;color:var(--accent);
  letter-spacing:.01em;white-space:pre;height:1.5em;
}
.sheet .chd:empty{height:1.5em}
.sheet .lyr{white-space:pre-wrap}
.sheet .seg.cho{margin-right:.55em}
.sheet .seg.cho .lyr{min-width:.2em}
.sheet .seg.cho .chd{padding-right:.15em}
.sheet.chords-hidden .chd{display:none}
.sheet.chords-hidden .line{align-items:baseline}

/* ============================================================ CHORD DIAGRAM CHART */
.chordchart{padding:18px 18px 20px}
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px 10px}
.cc-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--card)}
.cc-dia svg{width:88px;height:auto;display:block}
.cc-name{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.cc-cell.nodiag{justify-content:center;min-height:120px;color:var(--muted)}
.cc-nodiag{font-size:22px;color:var(--faint)}
.cc-note{margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.6}
.cc-hint{margin-top:12px;font-size:11px;color:var(--faint);letter-spacing:.02em}
.cc-empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13.5px}

/* ============================================================ NOTES */
.notes-block{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px 18px}
.notes-block h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.notes-block p{font-size:14px;color:var(--ink-soft);white-space:pre-wrap}

/* ============================================================ PRACTICE MODE */
.practice{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column}
.practice-top{
  display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 90%,transparent);flex-wrap:wrap
}
.practice-top h2{font-family:var(--serif);font-size:17px;font-weight:600}
.practice-top .by{font-size:12.5px;color:var(--muted)}
.practice-top .spacer{flex:1}
.practice-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.practice-inner{max-width:820px;margin:0 auto;padding:36px 26px 40vh}
.practice .sheet{--lyric-size:22px;line-height:2}
.practice .sheet .chd{color:var(--accent);font-weight:700}
.practice-bar{
  display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap
}
.practice-bar .group{display:inline-flex;align-items:center;gap:8px}
.font-ctrl{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.font-ctrl button{padding:7px 13px;font-size:13px}
.font-ctrl button:hover{background:var(--card-2)}
.font-ctrl .lbl{padding:0 8px;font-size:12px;color:var(--muted);min-width:40px;text-align:center}
.switch{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft)}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0}
.track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);transition:transform .16s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(18px)}
.speed{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.speed input[type=range]{width:110px;accent-color:var(--accent)}
.pnav{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.pnav:hover{background:var(--card-2)}
.pnav:disabled{opacity:.35;cursor:not-allowed}
.pnav svg{width:16px;height:16px}

/* ============================================================ REVIEW MODE */
.reviewmode{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column}
.review-top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 90%,transparent);flex-wrap:wrap}
.review-scope{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:12.5px;max-width:260px}
.review-count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.review-progress{height:3px;background:var(--line-soft)}
.review-progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.review-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.review-inner{max-width:1080px;margin:0 auto;padding:26px 24px 40px}
.review-headrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.review-headrow h2{font-size:24px;letter-spacing:-.02em}
.review-by{font-size:14px;color:var(--ink-soft);margin-top:2px}
.review-badge{border:none;cursor:pointer}
.review-facts{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:14px 0 20px}
.review-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1.4fr) minmax(0,320px);align-items:start}
.review-pane{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.review-bar{display:flex;align-items:center;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.review-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.review-done-mark{width:64px;height:64px;border-radius:999px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);font-size:30px;margin-bottom:16px}
.review-done h2{font-size:22px;letter-spacing:-.02em}
.review-done p{color:var(--muted);font-size:14px;margin-top:6px;max-width:360px}
.lib-review-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--accent-soft);
  background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:500}
.lib-review-btn:hover{filter:brightness(.97)}
@media (max-width:900px){
  .review-grid{grid-template-columns:1fr}
  .review-bar .btn{flex:1;justify-content:center;min-width:44%}
}

/* ============================================================ MODAL / FORMS */
.overlay{
  position:fixed;inset:0;z-index:90;background:rgba(30,27,24,.42);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;
}
.modal{
  width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--serif);font-size:19px}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);background:var(--card-2)}
.close-x{width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.close-x:hover{background:var(--card-2)}

.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px}
.field .hint{font-weight:400;color:var(--muted);letter-spacing:0}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);font-size:13.5px;
}
.field textarea{resize:vertical;min-height:90px;font-family:var(--mono);font-size:12.5px;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.chordedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper)}
.chordedit .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 4px 4px 9px;font-size:12px}
.chordedit .pill button{font-size:14px;line-height:1;color:var(--muted);width:16px}
.chordedit input{border:none;background:none;flex:1;min-width:80px;padding:4px;font-family:var(--mono);font-size:12.5px}
.chordedit input:focus{outline:none}
.sheet-rows{display:flex;flex-direction:column;gap:8px}
.sheet-row{display:grid;grid-template-columns:88px 1fr 1fr auto;gap:8px;align-items:center}
.sheet-row select,.sheet-row input{padding:7px 9px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.sheet-row button{color:var(--muted);padding:4px 8px}
.checks{display:flex;gap:20px;flex-wrap:wrap;margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.status-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.status-seg button{padding:7px 13px;font-size:12px;color:var(--ink-soft)}
.status-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.danger{color:var(--accent-ink)}
.btn.danger-btn{border-color:var(--accent-soft);color:var(--accent-ink)}
.btn.danger-btn:hover{background:var(--accent-soft)}

/* chord diagram popover */
.chordpop{
  position:absolute;z-index:95;background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:14px;width:150px;text-align:center;
}
.chordpop h5{font-family:var(--mono);font-size:14px;margin-bottom:8px}
.chordpop svg{display:block;margin:0 auto}
.chordpop .none{font-size:12px;color:var(--muted);padding:10px 0}

.settings-sec{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px 20px;margin-bottom:16px}
.settings-sec h3{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.settings-sec p{font-size:13px;color:var(--muted);margin-bottom:14px}
.settings-sec .row{display:flex;gap:10px;flex-wrap:wrap}
.cat-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.cat-list .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px}
.cat-list .pill button{color:var(--muted);width:16px;font-size:14px}
.src-note{font-size:12px;color:var(--muted);line-height:1.7}
.src-note code{font-family:var(--mono);font-size:11px;background:var(--card-2);padding:1px 5px;border-radius:4px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-soft);background:var(--card)}

/* ============================================================ RESPONSIVE */
@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .song-tabs{display:flex}
  .split .pane[data-tab]{display:none}
  .split .pane[data-tab].active{display:block}
  .split .chord-pane{position:static;top:auto}
}
@media (max-width:680px){
  .appbar-in{flex-wrap:wrap;gap:10px;padding:12px 15px}
  .searchwrap{order:3;max-width:none;flex-basis:100%}
  .brand b{font-size:18px}
  main{padding:20px 15px 90px}
  .lib-head h2{font-size:22px}
  .song-head h1{font-size:25px}
  .songs{grid-template-columns:1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .sheet-row{grid-template-columns:1fr 1fr;grid-auto-flow:row}
  .practice-inner{padding:26px 18px 45vh}
  .practice .sheet{--lyric-size:20px}
  .modal-body{max-height:64vh}
}
@media print{
  .appbar,.song-nav,.song-actions,.song-tabs,.pane-head,.notes-block{display:none!important}
  .split{display:block}.pane{border:none}
  body{background:#fff}
}
</style>
</head>

s sei que Tu estás comigo.\n4. O Teu festim me conforta,\nfaz-me cantar de alegria.\n5. Tua bondade me ajuda\nno viver de cada dia.\n6. Minha morada p'ra sempre\nseja Tua casa, Senhor.","chords":["D","G","A","E7","Em","Bb","C","G7","C7","F"],"id":"c-buscamos-por-ti","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Caminhando pela vida","artist":"","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"G","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"[G]1.Caminhando pela vida vou [Em]cantando\nvou [C]rezando ao meu [D]Deus.\nE [G]a gente que encontro em meu\n[Em]caminho\nme [C]ensina a ser [D]feliz.\n[G]Feliz caminhar para o [Em]Senhor,\n[C]Sempre a caminhar com muita [D]fé.\n[G]Feliz caminhar para o [Em]Senhor,\nE [C]no fim o [D]amor.\n2. Caminhando pela vida vou\ncantando,\nvou tentando ser melhor.\nE aos outros que caminham ao meu lado\nvou levando Teu amor.","lyrics":"1.Caminhando pela vida vou cantando\nvou rezando ao meu Deus.\nE a gente que encontro em meu\ncaminho\nme ensina a ser feliz.\nFeliz caminhar para o Senhor,\nSempre a caminhar com muita fé.\nFeliz caminhar para o Senhor,\nE no fim o amor.\n2. Caminhando pela vida vou\ncantando,\nvou tentando ser melhor.\nE aos outros que caminham ao meu lado\nvou levando Teu amor.","chords":["G","Em","C","D"],"id":"c-caminhando-pela-vida","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Caminharei","artist":"Gen Rosso","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficul l longevidade e ardor\n3. Que quando a maré baixar...\nSaberemos logo o que é o amor\nA dádiva mais querida, que nos foi...\nFoi concedida\n4. E por isto e pelo resto, não consigo\nexprimir\nVenho cá de dentro, agradecer-Te a Ti\ntambém\nÉ que não é possível, definir toda esta\npaz...\nEsta certeza... que nos modificou\nA alegria... de Vos sentir!","chords":["C","Dm","F","G","Am","E7"],"id":"c-este-grito-d-alma","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Estrela polar","artist":"Movimento dos Focolares","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"C#m","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"[C#m]1. Esta sede de Te encontrar [E]em mim\n[G#m]de correr p'ra Ti, de estar junto de [A]Ti.\n[F#m]Guias pelos vales o decurso do\nmeu [C#m]rio\n[A]única razão és [B]Tu, [G#m]único [C#m]sustento, Tu,\n[A]a minha vida existe porque existes [E]Tu.\n2. Gira o firmamento sem nunca ter paz,\nmas existe um ponto a brilhar para mim,\na Estrela Polar que fixa os meus passos,\na Estrela Polar és Tu, a estrela segura, Tu.\nA minha vida existe, porque existes Tu.\nTudo [C#m]gira à [A]Tua volta\nEm função [B]de [C#m]Ti….\nNão [G#m]importa quando,\n[A]Onde e o [B]porquê.\n3. Brilha a Tua luz no centro do meu\nser,\ndás sentido à vida que em mim\nnasceu.\nTudo o que farei será somente amor;\núnico sustento és Tu, a Estrela Polar,\nTu,\na minha vida existe porque existes Tu.\n\n55 | Eis que na dor\nSchoenstatt\n[C]1. Eis que [A7]na dor nós [Dm]encontramos,\n[G]Do\" Do\nescondida e viva, a semente\n[A7]da alegria e da [Dm]esp'rança:\n[G7][G]Do° DO\nO Senhor está vivo.\n2. Qual sol e preparou.\nEle unge minha fronte e me faz ser\nfeliz\ne transborda a minha taça em seu\namor.","lyrics":"1. Pelo sonho,\npelo sonho é que vamos\nCantando com alegria em Seu louvor\nChegamos, chegaremos\nSemeando os Teus frutos\nPelo sonho é que vamos até Ti,\nSenhor\nComungando o Teu Corpo\n2. Basta a fé, basta a fé no que temos\nE a esperança naquilo que seremos\nSe vivermos ou não\nNossa vida em construção\nBasta a fé no dia a dia\nBendizemos o Teu nome, ó Senhor\nJesus\nComungando o Teu Sangue\n3. Haja ou não haja frutos\nPelo sonho é que vamos até Ti,\nSenhor\nSomos um no Teu amor\n\n120 | Pelos prados e\ncampinas\nFrei Fabreti\n1. Pelos prados e campinas\nverdejantes eu vou.\nÉ o Senhor que me leva a descansar.\nJunto às fontes de águas puras\nrepousantes eu vou.\nMinhas forças o Senhor vai animar.\nTu és, Senhor, o meu pastor,\nPor isso nada na minha vida faltará.\n2. Nos caminhos mais seguros junto\nd'Ele eu vou,\ne pra sempre o seu nome eu honrarei.\nSe eu encontro mil abismos nos\ncaminhos eu vou,\nsegurança sempre tenho em suas\nmãos.\n3. Ao banquete, em sua casa, muito\nalegre eu vou,\num lugar em sua mesa me preparou.\nEle unge minha fronte e me faz ser\nfeliz\ne transborda a minha taça em seu\namor.","chords":["C","Am","F","G","Em"],"id":"c-pelo-sonho","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Permanece","artist":"Irene Guia","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"C","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"[C]Sib 6HA\n1. Viste como te levou Yahvé,\n[A7]o [Dm]teu [F]Deus [G]e [G7]Senhor…\n[C]Sil 6Ha\npor todo o caminho que percorrest m mim,\n[A][G]Aquele que vive em [D]mim.","lyrics":"1. Já sei que não te posso mais ajudar\nSei bem que não vais mudar\nTudo o que fazes é fácil de prever\nTens o teu rumo a correr\nSerá que não vais esperar\nTens surpresas para aceitar (uh uh)\nSai (sai) desse mundo\nTens tudo p'ra viver,\nserá que não sabes\nQue podes vencer o teu medo de perder\nSai (sai) desse mundo\nTens tudo para ver,\nserá que não sabes\nQue deixas fugir\nO que a vida nos dá p'ra sorrir\n2. Deixa que um sorriso seja para ti\nA vontade de sonhar\nMesmo que a vida pareça assim\nNão voltar a acordar\nVive tudo o que te faz rir\nChora tudo o que há p'ra chorar\n\n138 | Sal da terra (meu\ntudo)\nSimplus\n1. Senti-Te mesmo no nada.\nExperimentei a loucura da solidão\ndas trevas.\nSabia-Te presente,\nsabia-Te paciente\nPor Ti eu quero ser sal da terra,\nLataim Si-\nPor Ti eu quero ser luz do mundo!\nPercebi que sem Ti não sou\nDescobri que Contigo posso ser eu.\n2. Quando, por fim, já quase num\ngrito,\nchamei por Ti, já me tinhas\nconquistado.\nÉs aquele que espera\nAquele que sempre alcança.\n3. És aquele que não desiste\nAquele que vive em mim,\nAquele que vive em mim.","chords":["G","C","Am","D","Em","B7","Bm","A","F#m"],"id":"c-sai-desse-mundo","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"São dias que passam","artist":"","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"C","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"1. [C]São dias que passam, [Am]são horas que vão\nSão [F]lábios que cantam, [G]são mãos\nque se dão\nE [E]deixam saudades de [Am]não [F]ser assim\nToda a [C]vida, [G]a vida de [C]a ida é querido\nDo Senhor.\n2. Se Deus quiser\nhei de deixar de pensar em mim\ne assim vou dar\ntempo ao tempo para O adorar.\nSerei feliz\ne comigo será tudo o que\ncantar.","chords":["C","Am","F","G","E","Dm","Em","C7"],"id":"c-sao-dias-que-passam","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Sei que Te amar","artist":"","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"E","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"[E]1. Sei que Te [G#m]amar não é [A]fácil,\nmas eu vou [B]tentar.\n[E]Sei que Tu [G#m]sofres, [A]pois sabes\nque eu não vou [B]ficar.\n2. Ó [C#m]Senhor, [G#m]eu caio\ne [A]espero pela [B]Tua mão\nTeu [C#m]amor [G#m]sincero\nnunca [A]abandonar, nem [B]dizer não.\nPorque eu [E]sei que Tu [A]choraste,\n[F#m]Sabendo que eu não fui [B]capaz.\nE [E]agora vi que [A]reparaste\nQuando [F#m]eu não olhei para [B]trás.\n[C#m]Descobri [F#]em Ti,\n[B]Encontrei o caminho a [E]seguir.\nO que [C#m]eu já [F#]senti\n[A]Leva-me a querer [E][B]conseguir.\n\n2. Sei que, às vezes,\nvou um pouco longe demais\nquando Tu esperas,\nque eu vá para onde Tu vais.\n3. Se soubesses quanto eu gostava\nde sempre buscar\nos Teus passos mesmo quando\nsei que não vou encontrar.","lyrics":"1. Sei que Te amar não é fácil,\nmas eu vou tentar.\nSei que Tu sofres, pois sabes\nque eu não vou ficar.\n2. Ó Senhor, eu caio\ne espero pela Tua mão\nTeu amor sincero\nnunca abandonar, nem dizer não.\nPorque eu sei que Tu choraste,\nSabendo que eu não fui capaz.\nE agora vi que reparaste\nQuando eu não olhei para trás.\nDescobri em Ti,\nEncontrei o caminho a seguir.\nO que eu já senti\nLeva-me a querer ar\" (José\nFeliciano) | letra: João Bragança\n1. Que este Vinho e este Pão, Senhor,\nque nos dás nesta hora\nsejam um hino de esperança,\nde união e de amor.\n2. Seja a nossa oração, meu Deus,\na lembrança de Ti\nseja nossa a paixão,\nque sofreste, Jesus.\nSeja Cruz como um sinal,\nSeja o guia, seja a nossa voz,\nSeja Jesus Cristo, o Redentor\nNa vida de todos nós.\nSeja a Cruz como um sinal\nQue nos dá o Teu perdão.\nLivra-nos, Senhor, da tentação,\nLivra-nos de todo o mal.\n\n3. Que este Vinho e este Pão, Senhor,\nque nos dás nesta hora de fé\nsejam sempre oração,\nsejam um hino de louvor.\nSeja a cruz...\n143 | Semente crescida\nMi-7 (Mi agudo*\nEnsinaste-me a pedir\n• Pão de cada dia,\nque apenas nos dá força\nna Tua companhia\nSemente crescida\nÉs o pão que nos dá vida,\nDa água nos dás\nGota a gota\nRe Mi-7* Do° Sol\nA Tua paz,\nA Tua paz,\n* Mi-7 /Mi agudo","chords":["Am","Dm7","G","C","E","Dm","A7","D","C9","Em7"],"id":"c-seja-a-cruz","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Sempre Pensando em Ti","artist":"","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"C","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"Ti\n[C]1. Sempre pensando em Ti, Senhor,\n[Dm]sempre pensando em Ti.\nTu [F]és o Sol que [G]brilha, que [C]está dentro\nde mim.\nSempre pensando em Ti, Senhor,\nsempre pensando em Ti,\nTu és a fonte d'água, que se encontra\nem mim.\n[F]Senhor, [G]perdoai as minhas [C7][C]faltas,\n[G][F]Ajudai-me ser um bom [C7][C]cristão.\nEu [F]quero sempre [G]viver [C]o [C]bem até\n[G][F][Am]Morrer-------\nEu quero [C]ser feliz.\n2. Sempre pensando em Ti, Senhor,\nse o a minha entrega.\n156 | Só Deus basta\nSanta Teresa de Ávila\n[G]Tu [D]nada [C]temas, nada te [D]espante\n[G]Pois [D]tudo [C]passa, Deus [D]nunca muda\n[Em]A [C][Bm]paciência tudo [G]alcança\n[Em]Quem a [C]Deus [Am]tem nada lhe [D]falta.\nSó [G]Deus [D]basta,\nSó [C]Deus [D]basta,\nSó [Em]Deus [C]basta\n[D]Aleluia!.","lyrics":"reparte\nLa Maj7\n1. Os meus passos pouco seguros,\nFa#t- Si-\nmeu horizonte às vezes magoado.\nMaria, que andaste só,\nés a claridade deste andar.....\nSenhor, Tu estás aí,\nQueres dizer-me alguma coisa.\n\nQuando hesito, sei que me empurras,\nQuando avanço, és Tu que andas,\nQuando me dou, és Tu que dás.\n2. Enquanto ando, Deus não tem pressa.\nNão fico p'ra trás, nem esqueço ninguém.\nAvanço a Teu lado, Senhor,\ne os meus pés fazem Teu caminho.\n3. Mesmo quando dou um passo atrás,\nsei que posso sempre repartir.\nReparto tudo o que sou,\nfaço do meu tempo a minha entrega.\n156 | Só Deus basta\nSanta Teresa de Ávila\nTu nada temas, nada te espante\nPois tudo passa, Deus nunca muda\nA paciência tudo alcança\nQuem a Deus tem nada lhe falta.\nSó Deus basta,\nSó Deus basta,\nSó Deus basta\nAleluia!.","chords":["E","Bm","F#m","G","D","A","Em","Fm","C","B7","Am"],"id":"c-so-avanca-quem","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Só por Ti, Jesus","artist":"","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"C","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"Pe. Marcelo Rossi\n1. Só [C]por Ti, Jesus, quero me [Em]consumir,\ncomo vela que [F]queima no altar.\n[Dm]Consumir de [G]amor.\n2. Só por Ti, Jesus, quero me derramar,\ncomo o rio se entrega a o Teu Sangue neste Cálice,\nbebo o Sangue da Nova Aliança.\nO que derramaste pelos homens\npara remissão e esperança.\n3. Tomando este Pão que é Teu Corpo,\ncomungo a Igreja transcendente.\nFaz Teu corpo eterna a minha alma.\nPela fé me salva para sempre.\n4. Eu venho faminto a esta mesa\nonde Tu Te dás em plenitude.\nVenho comungar a esperança,\na vida da minha juventude.\n5. Levarei comigo a Tua luz.\nIrei pelo mundo anunciar\nque por nós morreste numa Cruz,\nmas quiseste o mundo transformar.","lyrics":"H. Faria\nTomai e recebei as horas do meu dia,\nAlegrias e dores, penas e trabalhos.\nFora eu rico, Senhor, e muito Vos\ndaria,\nMas sei que nada valho.\n1. Que tenho eu, meu Deus, p'ra pôr\nsobre a patena\nQue as mãos do sacerdote elevam no\naltar?\nA não ser esta imensa, esta infinita\npena\nDe nada ter p'ra dar...\nTomai e recebei...\n2. Com o trigo loiro, deponho na\npatena\nA minha vida inteira, ofereço-a no\naltar;\nMas ainda me fica esta infinita pena\nDe nada ter p'ra dar...\n\n162 | Tomo este pão\nDomingos | Nelson Braga\nTomo este pão e este vinho\nEm memória do meu Salvador--;\nTomo este pão e este vinho:\nSão o corpo e sangue do Senhor.\n1. Comendo o Teu corpo que foi trigo\nsuado nas mãos do lavrador,\nlevo a Tua força que alimenta\np'ra mudar o mundo com amor.\n2. Bebendo o Teu Sangue neste Cálice,\nbebo o Sangue da Nova Aliança.\nO que derramaste pelos homens\npara remissão e esperança.\n3. Tomando este Pão que é Teu Corpo,\ncomungo a Igreja transcendente.\nFaz Teu corpo eterna a minha alma.\nPela fé me salva para sempre.\n4. Eu venho faminto a esta mesa\nonde Tu Te dás em plenitude.\nVenho comungar a esperança,\na vida da minha juventude.\n5. Levarei comigo a Tua luz.\nIrei pelo mundo anunciar\nque por nós morreste numa Cruz,\nmas quiseste o mundo transformar.","chords":["C","G","F","Dm","Am","E","B","A","C#m","F#m"],"id":"c-tomai-e-recebei","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","la  é o peso da glória que nos\nespera um dia.","chords":["C","C7","G","F","G7","Fm","Am","Dm"],"id":"c-vaso-novo","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Vede, Senhor","artist":"","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"D","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified":false,"status":"review","lyricsWithChords":"Adap. \"As tears go by\" (Rolling\nStones) | Ana Pinto Leite\n[D]1. Vede, [E]Senhor, [G]quanta [A]gente\n[D]nunca [E]ouviu falar [G]de [A]Vós--\n[G]Quanta [A]gente não sabe\n[D]que deve [Bm]amar alguém.\n[G]Senhor, aceitai-nos [A]assim.\n2. Vede, Senhor, nós chegámos\nprontos a dar o que temos:\na vida alegre ou triste,\no amor que em nós existe.\nSenhor, aceitai-nos assim.","lyrics":"Adap. \"As tears go by\" (Rolling\nStones) | Ana Pinto Leite\n1. Vede, Senhor, quanta gente\nnunca ouviu falar de Vós--\nQuanta gente não sabe\nque deve amar alguém.\nSenhor, aceitai-nos assim.\n2. Vede, Senhor, nós chegámos\nprontos a dar o que temos:\na vida alegre ou triste,\no amor que em nós existe.\nSenhor, aceitai-nos assim.","chords":["D","E","G","A","Bm"],"id":"c-vede-senhor","createdAt":"2021-11-19T00:00:00.000Z","updatedAt":"2021-11-19T00:00:00.000Z","sheetMusic":[{"type":"pdf","label":"Cancioneiro (scan)","src":"archive/#Cancioneiro.pdf"}]},{"title":"Vem viver em nós","artist":"","category":"Cânticos","language":"Portuguese","instrument":"Ukulele","difficulty":"","key":"C","capo":0,"tuning":"gCEA","subcategory":"","tags":["liturgical","guitar-origin"],"notes":"From the EJNS Cancioneiro (scanned · OCR).  Bass notes from the original guitar chords were dropped for ukulele.","favorite":false,"verified /* ------------------------------------------------------------------ UTILITIES */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const el = (tag, props={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)){
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "dataset") Object.assign(n.dataset, v);
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const kid of kids.flat()){ if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return n;
};
const uid = () => "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const deaccent = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
const fold = s => deaccent(String(s||"")).toLowerCase().trim();
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const debounce = (fn, ms=180) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };
// Encode a relative file path for use as a URL: keeps "/" but escapes spaces,
// "#", "?" etc. Absolute URLs (http:, file:) are passed straight through.
const encPath = p => /^[a-z]+:/i.test(p||"") ? p : String(p||"").split("/").map(encodeURIComponent).join("/");
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
const CHORD_TOKEN = /^[A-G](#|b)?(maj|min|m|sus|dim|aug|add|M)?\d{0,2}(sus[24]|add\d|maj7|M7)?(\/[A-G](#|b)?)?$/;
const isChord = t => CHORD_TOKEN.test(String(t||"").trim());

/* ------------------------------------------------------------------ DATA (seed) */
const SEED = (() => {
  try { return JSON.parse($("#seed-data").textContent || "[]"); }
  catch(e){ console.error("seed parse failed", e); return []; }
})();

  const base = ["Portuguese","English","Spanish","French","Folk","Pop","Rock","Film & TV","Christmas","Traditional","Campfire","Other"];
  const fromSeed = [...new Set(SEED.map(s => s.category).filter(Boolean))];
  return [...new Set([...base, ...fromSeed])];
})();

/* ==========================================================================

const Store = (() => {

  const DEFAULT_PREFS = { view:"grid", sort:"title", chordMode:"contains", showChords:true, fontStep:0, autoscrollSpeed:3 };

  const read = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ toast("Storage full — export a backup"); return false; } };

  // one-time normalisation so every record has the full schema
  function normalize(s){
    return {
      id: s.id || uid(),
      title: s.title || "Untitled",
      artist: s.artist || "Unknown",
      category: s.category || "Other",
      subcategory: s.subcategory || "",
      language: s.language || "",
      difficulty: s.difficulty || "",
      instrument: s.instrument || "Ukulele",
      key: s.key || "",
      capo: Number(s.capo) || 0,
      tuning: s.tuning || "gCEA",
      chords: Array.isArray(s.chords) ? s.chords.slice() : [],
      lyrics: s.lyrics || "",
      lyricsWithChords: s.lyricsWithChords || s.lyrics || "",
      sheetMusic: Array.isArray(s.sheetMusic) ? s.sheetMusic.map(x => ({ type:x.type||"pdf", label:x.label||"", src:x.src||"" })) : [],
      tags: Array.isArray(s.tags) ? s.tags.slice() : [],
      notes: s.notes || "",
      favorite: !!s.favorite,
      verified: !!s.verified,
      status: s.status || (s.verified ? "verified" : "review"),   // verified | review | missing
      createdAt: s.createdAt || nowISO(),
      updatedAt: s.updatedAt || s.createdAt || nowISO(),
    };
  }

  let _songs = null, _cats = null;
  function songs(){ if (!_songs){ _songs = (read(K.songs, null) || SEED).map(normalize); } return _songs; }
  function persist(){ write(K.songs, _songs); }

  return {
    /* --- songs --- */
    getSongs(){ return songs().slice(); },
    getSong(id){ return songs().find(s => s.id === id) || null; },
    addSong(data){
      const s = normalize({ ...data, id: uid(), createdAt: nowISO(), updatedAt: nowISO() });
      _songs = [s, ...songs()]; persist(); return s;
    },
    updateSong(id, patch){
      const i = songs().findIndex(s => s.id === id); if (i < 0) return null;
      _songs[i] = normalize({ ..._songs[i], ...patch, id, updatedAt: nowISO() });
      persist(); return _songs[i];
    },
    deleteSong(id){ _songs = songs().filter(s => s.id !== id); persist(); Store.removeRecent(id); },
    toggleFavorite(id){ const s = Store.getSong(id); if (s) return Store.updateSong(id, { favorite: !s.favorite }); },

    /* --- categories --- */
    getCategories(){ if (!_cats) _cats = read(K.cats, null) || DEFAULT_CATEGORIES.slice(); return _cats.slice(); },
    addCategory(name){ name = String(name||"").trim(); if (!name) return; const c = Store.getCategories();
      if (!c.some(x => fold(x) === fold(name))){ c.push(name); _cats = c; write(K.cats, c); } },
    deleteCategory(name){ _cats = Store.getCategories().filter(c => c !== name); write(K.cats, _cats); },

    /* --- preferences --- */
    getPrefs(){ return { ...DEFAULT_PREFS, ...read(K.prefs, {}) }; },
    savePreferences(patch){ write(K.prefs, { ...Store.getPrefs(), ...patch }); },

    /* --- recently used --- */
    getRecent(){ return read(K.recent, []); },
    pushRecent(id){ const r = [id, ...Store.getRecent().filter(x => x !== id)].slice(0, 14); write(K.recent, r); },
    removeRecent(id){ write(K.recent, Store.getRecent().filter(x => x !== id)); },

    /* --- data lifecycle --- */
    exportAll(){ return { app:"my-music", version:1, exportedAt: nowISO(),
      songs: Store.getSongs(), categories: Store.getCategories(), preferences: Store.getPrefs() }; },
    importAll(obj, mode){
      const incoming = (obj.songs || []).map(normalize);
      if (mode === "replace"){ _songs = incoming; }
      else { const byKey = new Map(songs().map(s => [s.id, s]));
        for (const s of incoming) byKey.set(s.id, s);
        _songs = [...byKey.values()];
      }
      persist();
      if (Array.isArray(obj.categories) && obj.categories.length){ _cats = [...new Set(obj.categories)]; write(K.cats, _cats); }
      if (obj.preferences) Store.savePreferences(obj.preferences);
      return _songs.length;
    },
    resetDemo(){ _songs = SEED.map(normalize); persist();
      _cats = DEFAULT_CATEGORIES.slice(); write(K.cats, _cats);
      write(K.recent, []); }
  };
})();

/* ==========================================================================
   STATE  —  transient view state (filters, search). Persisted bits live in prefs.
   ========================================================================== */
const State = {
  q: "",
  filter: { kind:"all", value:null },   // all | favorites | recent | category | artist | language | difficulty
  chords: new Set(),
  get prefs(){ return Store.getPrefs(); },
  set prefs(p){ Store.savePreferences(p); },
};

/* ==========================================================================
   SEARCH  —  forgiving, accent/case-insensitive, chord-aware.
   ========================================================================== */
function searchIndex(s){
  return fold([ s.title, s.artist, s.category, s.subcategory, s.language, s.difficulty,
                s.instrument, s.tags.join(" "), s.chords.join(" "), s.lyrics ].join("  "));
}
const asChord = t => { t = String(t||"").trim(); return isChord(t) ? t : (isChord(t[0]?.toUpperCase() + t.slice(1)) ? t[0].toUpperCase() + t.slice(1) : null); };
function songMatchesQuery(s, q){
  const raw = String(q||"").trim();
  if (!raw) return true;
  // whole query is a set of chord names → require the song to contain them all
  const rawToks = raw.split(/\s+/);
  const chordToks = rawToks.map(asChord);
  if (rawToks.length >= 1 && chordToks.every(Boolean)){
    const have = new Set(s.chords.map(fold));
    return chordToks.every(c => have.has(fold(c)));
  }
  const idx = searchIndex(s);
  return fold(raw).split(/\s+/).every(tok => idx.includes(tok));
}

/* ==========================================================================
   FILTERS  —  turn State into a song list.
   ========================================================================== */
function applyFilters(){
  let list = Store.getSongs();
  const f = State.filter;

  if (f.kind === "favorites") list = list.filter(s => s.favorite);
  else if (f.kind === "recent"){ const order = Store.getRecent();
    list = order.map(id => list.find(s => s.id === id)).filter(Boolean); }
  else if (f.kind === "category") list = list.filter(s => s.category === f.value);
  else if (f.kind === "artist")   list = list.filter(s => s.artist === f.value);
  else if (f.kind === "language") list = list.filter(s => s.language === f.value);
  else if (f.kind === "difficulty") list = list.filter(s => s.difficulty === f.value);

  if (State.chords.size){
    const want = [...State.chords].map(fold);
    const mode = State.prefs.chordMode;
    list = list.filter(s => {
      const have = new Set(s.chords.map(fold));
      const hasAll = want.every(c => have.has(c));
      if (mode === "only") return hasAll && [...have].every(c => want.includes(c));
      return hasAll;
    });
  }

  list = list.filter(s => songMatchesQuery(s, State.q));

  if (f.kind !== "recent"){
    const sort = State.prefs.sort;
    const cmp = {
      title:  (a,b) => fold(a.title).localeCompare(fold(b.title)),
      artist: (a,b) => fold(a.artist).localeCompare(fold(b.artist)) || fold(a.title).localeCompare(fold(b.title)),
      recent: (a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||""),
      added:  (a,b) => (b.createdAt||"").localeCompare(a.createdAt||""),
    }[sort] || (()=>0);
    list = list.slice().sort(cmp);
  }
  return list;
}

/* ==========================================================================
   ROUTING  —  hash based. #/  ·  #/song/:id  ·  #/practice/:id  ·  #/settings
   ========================================================================== */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [name, ...rest] = h.split("/");
  return { name: name || "library", param: decodeURIComponent(rest.join("/") || "") };
}
function go(path){ location.hash = path; }
function render(){
  closeChordPop();
  const { name, param } = parseHash();
  const root = $("#view");
  if (name !== "review") destroyReview();
  if (name === "song")      return renderSong(root, param);
  if (name === "practice")  return renderPractice(param);
  if (name === "review")    return renderReview(param);
  if (name === "settings")  return renderSettings(root);
  return renderLibrary(root);
}
window.addEventListener("hashchange", render);

// a chip that opens a native <select> for long option lists
function dropdownChip(label, options, current, onPick){
  if (!options.length) return document.createTextNode("");
  const wrap = el("span", { style:"position:relative;display:inline-flex" });
  const chip = el("button", { class:"chip", "aria-pressed": current ? "true":"false" },
    current ? `${label}: ${current}` : label,
    el("span", { "aria-hidden":"true", style:"opacity:.5" }, " ▾"));
  const sel = el("select", { "aria-label":label,
    style:"position:absolute;inset:0;opacity:0;width:100%;cursor:pointer",
    onchange:e => onPick(e.target.value || null) });
  sel.append(el("option", { value:"" }, `All ${label.toLowerCase()}s`));
  options.forEach(o => sel.append(el("option", { value:o, selected:o===current }, o)));
  wrap.append(chip, sel);
  return wrap;

/* ==========================================================================
   CHORD/LYRIC PARSING & RENDERING  — the heart of the app.
   `lyricsWithChords` uses inline [Chord] markers:  "[C]Now I've [Am]heard"
   A line that is exactly "[Something]" where Something is NOT a chord is a
   section header (e.g. [Chorus], [Verse 1]).
   ========================================================================== */
function parseSongText(text){
  const lines = String(text || "").replace(/\r/g,"").split("\n");
  const out = [];
  for (let raw of lines){
    const t = raw.trim();
    if (!t){ out.push({ type:"blank" }); continue; }

    // whole line is a bracketed label that isn't a chord  ->  section header
    const only = t.match(/^\[([^\]]+)\]$/);
    if (only && !isChord(only[1].trim())){ out.push({ type:"section", label: only[1].trim() }); continue; }

    // line STARTS with a non-chord label, then more content  ("[Intro] D  G  A")
    const lead0 = t.match(/^\[([^\]]+)\]\s*(.*)$/);
    if (lead0 && !isChord(lead0[1].trim())){
      out.push({ type:"section", label: lead0[1].trim() });
      if (!lead0[2].trim()) continue;
      raw = lead0[2];
    }

    // split into [chord]text segments; keep any leading text before the first chord
    const segs = [];
    const re = /\[([^\]]+)\]/g;
    let last = 0, m, lead = "";
    while ((m = re.exec(raw)) !== null){
      const before = raw.slice(last, m.index);
      if (segs.length === 0 && before) lead = before;
      else if (segs.length) segs[segs.length-1].text += before;
      segs.push({ chord: m[1].trim(), text: "" });
      last = re.lastIndex;
    }
    const tail = raw.slice(last);
    if (segs.length) segs[segs.length-1].text += tail;
    out.push(segs.length ? { type:"lyric", lead, segs } : { type:"lyric", lead: raw, segs: [] });
  }
  return out;
}

function renderSheet(text, { interactive=true } = {}){
  const wrap = el("div", { class:"sheet" });
  parseSongText(text).forEach(node => {
    if (node.type === "blank"){ wrap.append(el("div", { class:"line blank" })); return; }
    if (node.type === "section"){ wrap.append(el("div", { class:"sec" }, node.label)); return; }
    const line = el("div", { class:"line" });
    if (node.lead){
      line.append(el("span", { class:"seg" }, el("span", { class:"chd" }, ""), el("span", { class:"lyr" }, node.lead)));
    }
    node.segs.forEach(seg => {
      const cho = !seg.text.trim();
      const s = el("span", { class:"seg" + (cho ? " cho":"") });
      const ch = el("span", { class:"chd" }, seg.chord);
      if (interactive){ ch.setAttribute("role","button"); ch.tabIndex = 0; ch.style.cursor = "pointer";
        ch.addEventListener("click", e => showChordPop(seg.chord, e.currentTarget));
        ch.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); showChordPop(seg.chord, e.currentTarget); } });
      }
      s.append(ch, el("span", { class:"lyr" }, seg.text || (cho ? " " : "")));
      line.append(s);
    });
    wrap.append(line);
  });
  return wrap;
}

function syncSongTabs(){
  const onMobile = window.matchMedia("(max-width:900px)").matches;
  $$(".song-tabs button").forEach(b => {});
  $$(".split .pane").forEach(p => {
    const t = p.dataset.tab;
    if (!onMobile){ p.style.display = (t === "info") ? "none" : ""; p.classList.remove("active"); return; }
    const active = t === _songTab;
    p.classList.toggle("active", active);
    p.style.display = active ? "" : "none";
  });
  $$(".song-tabs button").forEach(b => {
    b.setAttribute("aria-pressed", b.textContent.toLowerCase().startsWith(_songTab) ? "true" : "false");
  });
}
window.addEventListener("resize", debounce(() => { if (parseHash().name === "song") syncSongTabs(); }, 200));

/* ==========================================================================
   CHORD CHART  —  renders a fingering diagram for every chord the song uses.
   Diagrams are drawn from the SHAPES table (see CHORD DIAGRAMS section); a
   chord with no known shape shows its name only. Extension point: add shapes.
   ========================================================================== */
function buildChordChart(song){
  const box = el("div", { class:"chordchart" });
  const chords = Array.isArray(song.chords) ? song.chords : [];
  if (!chords.length){
    box.append(el("div", { class:"cc-empty" }, "No chords listed for this song.",
      el("div", { style:"margin-top:10px" }, el("button", { class:"btn sm", onclick:() => openSongForm(song) }, "Add chords"))));
    return box;
  }
  const grid = el("div", { class:"cc-grid" });
  const missing = [];
  chords.forEach(name => {
    const svg = chordSVG(name);
    const cell = el("div", { class:"cc-cell" + (svg ? "" : " nodiag") });
    if (svg){
      const dia = el("div", { class:"cc-dia", html: svg });
      cell.append(dia);
    } else {
      missing.push(name);
      cell.append(el("div", { class:"cc-nodiag" }, "—"));
    }
    cell.append(el("div", { class:"cc-name" }, name));
    grid.append(cell);
  });
  box.append(grid);
  if (missing.length){
    box.append(el("div", { class:"cc-note" },
      `No diagram yet for ${missing.join(", ")}. Add a fret pattern to the SHAPES table in the code to include it.`));
  }
  box.append(el("div", { class:"cc-hint" }, `${song.tuning || "gCEA"} tuning · ● finger · ○ open · × muted`));
  return box;
}

/* ==========================================================================
   PRACTICE MODE  —  digital music stand.
   ========================================================================== */
let _practice = null;
function destroyPractice(){
  if (_practice){ cancelAnimationFrame(_practice.raf); clearInterval(_practice.tick);
    if (_practice.wakeLock && _practice.wakeLock.release) _practice.wakeLock.release().catch(()=>{});
    _practice = null; }
  $("#practice-root").replaceChildren();
  document.body.style.overflow = "";
}
function renderPractice(id){
  const list = applyFilters();
  let songList = list.length ? list : Store.getSongs();
  let pos = songList.findIndex(s => s.id === id);
  if (pos < 0){ songList = Store.getSongs(); pos = songList.findIndex(s => s.id === id); }
  const s = songList[pos] || Store.getSong(id);
  if (!s){ go("#/"); return; }
  Store.pushRecent(s.id);

  destroyPractice();
  document.body.style.overflow = "hidden";
  const prefs = State.prefs;
  let fontStep = prefs.fontStep || 0;
  let scrolling = false;
  let speed = prefs.autoscrollSpeed || 3;

  const rootEl = el("div", { class:"practice" });

  const top = el("div", { class:"practice-top" });
  top.append(el("button", { class:"btn sm ghost", onclick:() => history.length > 1 ? history.back() : go(`#/song/${s.id}`) }, "✕ Close"));
  top.append(el("div", {}, el("h2", {}, s.title), el("div", { class:"by" }, s.artist)));
  top.append(el("span", { class:"spacer" }));
  const facts = el("div", { style:"display:flex;gap:6px;flex-wrap:wrap" });
  [s.key && `Key ${s.key}`, s.capo && `Capo ${s.capo}`, ...s.chords].filter(Boolean)
    .forEach(f => facts.append(el("span", { class:"fact" }, f)));
  top.append(facts);
  rootEl.append(top);

  const scroll = el("div", { class:"practice-scroll" });
  const inner = el("div", { class:"practice-inner" });
  const sheet = renderSheet(s.lyricsWithChords, { interactive:true });
  inner.append(sheet);
  scroll.append(inner);
  rootEl.append(scroll);

  const bar = el("div", { class:"practice-bar" });

  const prevBtn = el("button", { class:"pnav", "aria-label":"Previous song", disabled: pos<=0,
    onclick:() => step(-1), html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>' });
  const nextBtn = el("button", { class:"pnav", "aria-label":"Next song", disabled: pos>=songList.length-1,
    onclick:() => step(1), html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>' });

  const fontCtrl = el("div", { class:"font-ctrl" });
  const fLbl = el("span", { class:"lbl" }, "A");
  fontCtrl.append(
    el("button", { "aria-label":"Smaller text", onclick:() => { fontStep = Math.max(-4, fontStep-1); applyFont(); persistPractice(); } }, "−"),
    fLbl,
    el("button", { "aria-label":"Larger text", onclick:() => { fontStep = Math.min(10, fontStep+1); applyFont(); persistPractice(); } }, "+"),
  );

  const scrollWrap = el("label", { class:"switch" });
  const scrollCb = el("input", { type:"checkbox", onchange:e => { scrolling = e.target.checked; scrolling ? startScroll() : stopScroll(); } });
  scrollWrap.append(scrollCb, el("span", { class:"track" }), el("span", {}, "Auto-scroll"));

  const speedWrap = el("span", { class:"speed" });
  const speedInput = el("input", { type:"range", min:"1", max:"10", value:String(speed), "aria-label":"Scroll speed",
    oninput:e => { speed = +e.target.value; persistPractice(); } });
  speedWrap.append("Slow", speedInput, "Fast");

  const favBtn = el("button", { class:"btn sm", onclick:() => { Store.toggleFavorite(s.id);
    favBtn.textContent = Store.getSong(s.id).favorite ? "♥" : "♡"; } }, s.favorite ? "♥" : "♡");

  bar.append(el("div", { class:"group" }, prevBtn, nextBtn),
             el("div", { class:"group" }, fontCtrl),
             el("div", { class:"group" }, scrollWrap, speedWrap),
             el("div", { class:"group" }, favBtn));
  rootEl.append(bar);
  $("#practice-root").replaceChildren(rootEl);
  applyFont();

  function applyFont(){ const size = 22 + fontStep * 2;
    sheet.style.setProperty("--lyric-size", size + "px");
    fLbl.textContent = size + "px"; }
  function persistPractice(){ State.prefs = { fontStep, autoscrollSpeed: speed }; }
  function startScroll(){
    stopScroll();
    let acc = scroll.scrollTop;                 // sub-pixel accumulator
    const last = { t: performance.now() };
    _practice.tick = setInterval(() => {
      const now = performance.now(), dt = Math.min(120, now - last.t); last.t = now;
      acc += (10 + speed * 14) * (dt / 1000);   // px/sec, speed 1→24px/s, 10→150px/s
      scroll.scrollTop = acc;
      if (scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 2){
        stopScroll(); scrollCb.checked = false; scrolling = false;
      }
    }, 33);
  }
  function stopScroll(){ if (_practice) clearInterval(_practice.tick); }
  function step(dir){
    const np = pos + dir;
    if (np < 0 || np >= songList.length) return;
    go(`#/practice/${songList[np].id}`);
  }

  _practice = { raf:0, tick:0, step, song:s, wakeLock:null };
  // keep the screen awake while practising, if the browser allows it
  if ("wakeLock" in navigator){ navigator.wakeLock.request("screen").then(w => { if (_practice) _practice.wakeLock = w; }).catch(()=>{}); }
}

/* ==========================================================================
   REVIEW MODE  —  step through the verification queue one song at a time.
   ========================================================================== */
const Review = (() => {
  const SCOPES = {
    flagged:  { label:"Needs review + missing", test:s => s.status !== "verified" },
    review:   { label:"Needs review only",      test:s => s.status === "review" },
    missing:  { label:"Missing info only",      test:s => s.status === "missing" },
    canticos: { label:"Cânticos (OCR)",         test:s => s.category === "Cânticos" && s.status !== "verified" },
    ocr:      { label:"All OCR imports",         test:s => /^(c|s)-/.test(s.id) },
    all:      { label:"Every song",              test:() => true },
  };
  let ids = [], pos = 0, scope = "flagged", verifiedThisPass = 0;

  function queueFor(sc){
    const t = (SCOPES[sc] || SCOPES.flagged).test;
    return Store.getSongs().filter(t).sort((a,b) => fold(a.title).localeCompare(fold(b.title))).map(s => s.id);
  }
  function count(sc="flagged"){ return queueFor(sc).length; }

  function start(sc, startId){
    scope = sc && SCOPES[sc] ? sc : "flagged";
    ids = queueFor(scope);
    verifiedThisPass = 0;
    pos = startId ? Math.max(0, ids.indexOf(startId)) : 0;
    go(startId && ids.includes(startId) ? `#/review/${startId}` : "#/review");
  }
  function ensure(id){                        // called by renderReview on (re)entry
    if (!ids.length) ids = queueFor(scope);
    if (id){ const i = ids.indexOf(id); if (i >= 0) pos = i; }
    pos = Math.min(Math.max(0, pos), Math.max(0, ids.length - 1));
  }
  function currentId(){ return ids[pos]; }
  function setScope(sc){
    const keep = currentId();
    scope = sc; ids = queueFor(scope);
    pos = Math.max(0, ids.indexOf(keep)); if (pos < 0) pos = 0;
    go(ids.length ? `#/review/${ids[pos]}` : "#/review");
  }
  function go_(delta){
    pos += delta;
    if (pos >= ids.length){ go("#/review/done"); return; }
    if (pos < 0) pos = 0;
    go(`#/review/${ids[pos]}`);
  }
  function markGood(){
    const id = currentId(); if (!id) return;
    const s = Store.getSong(id);
    if (s && s.status !== "verified"){ Store.updateSong(id, { status:"verified", verified:true }); verifiedThisPass++; }
    go_(1);
  }
  function toggleVerified(){
    const id = currentId(); if (!id) return;
    const s = Store.getSong(id); if (!s) return;
    const now = s.status === "verified" ? "review" : "verified";
    Store.updateSong(id, { status: now, verified: now === "verified" });
    render();
  }
  function drop(id){
    const i = ids.indexOf(id); if (i >= 0) ids.splice(i, 1);
    if (pos > i) pos--;
    if (pos >= ids.length) go("#/review/done"); else go(`#/review/${ids[pos]}`);
  }
  function exit(){
    const n = verifiedThisPass;
    ids = []; pos = 0;
    go("#/");
    if (n) setTimeout(() => toast(`Review — ${n} song${n===1?"":"s"} marked verified`), 60);
  }
  return { SCOPES, start, ensure, setScope, next:() => go_(1), prev:() => go_(-1),
           markGood, toggleVerified, drop, exit, currentId, count,
           get pos(){ return pos; }, get total(){ return ids.length; }, get scope(){ return scope; },
           get verifiedThisPass(){ return verifiedThisPass; } };
})();

function destroyReview(){ $("#review-root").replaceChildren(); if (parseHash().name !== "practice") document.body.style.overflow = ""; }

function renderReview(param){
  destroyPractice();

      el("p", {}, Review.verifiedThisPass
        ? `You marked ${Review.verifiedThisPass} song${Review.verifiedThisPass===1?"":"s"} as verified this pass.`
        : "Every song in this scope has been looked at."),
      el("div", { style:"display:flex;gap:10px;margin-top:18px" },
        Review.total ? el("button", { class:"btn", onclick:() => Review.start(Review.scope) }, "Run through again") : "",
        el("button", { class:"btn primary", onclick:() => Review.exit() }, "Back to library"))));

  inner.append(headRow);

  const facts = el("div", { class:"review-facts" });
  [s.category, s.language, s.difficulty, s.instrument, s.key && `Key ${s.key}`, s.capo && `Capo ${s.capo}`]
    .filter(Boolean).forEach(f => facts.append(el("span", { class:"fact" }, f)));
  s.chords.forEach(c => facts.append(el("span", { class:"fact chord", role:"button", tabindex:"0",
    onclick:e => showChordPop(c, e.currentTarget) }, c)));
  s.tags.forEach(t => facts.append(el("span", { class:"fact" }, "#"+t)));
  s.sheetMusic.filter(x => x.src).forEach(x => facts.append(

  const cp = el("div", { class:"review-pane chord-pane" },

  grid.append(cp);

    el("h4", {}, "Notes"), el("p", {}, s.notes)));

  scroll.append(inner);
  root.append(scroll);

  // -- action bar
  const bar = el("div", { class:"review-bar" });
  bar.append(
    el("button", { class:"btn", disabled: Review.pos <= 0, onclick:() => Review.prev() }, "‹ Prev"),
    el("span", { style:"flex:1" }),
    el("button", { class:"btn", onclick:() => openSongForm(s, { returnTo:`#/review/${s.id}` }) }, "✎ Edit"),
    el("button", { class:"btn danger-btn", onclick:() => confirmDelete(s, { returnTo:`#/review/${s.id}` }) }, "Delete"),
    el("button", { class:"btn", onclick:() => Review.next() }, "Skip →"),
    el("button", { class:"btn primary", onclick:() => Review.markGood() }, "✓ Looks good →"));
  root.append(bar);

  $("#review-root").replaceChildren(root);
