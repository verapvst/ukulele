<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Music</title>
<style>
/* ============================================================ DESIGN TOKENS */
:root{
  /* light — Apple-style: white surfaces, cool greys, system blue accent */
  --paper:#ffffff; --card:#ffffff; --card-2:#f5f5f7;
  --ink:#1d1d1f; --ink-soft:#42424a; --muted:#6e6e73; --faint:#8e8e93;
  --line:#d8d8de; --line-soft:#ececf0;
  --accent:#0071e3; --accent-hover:#0060c8; --accent-soft:#e8f1fd; --accent-ink:#0067d4;
  --ok:#1d8a3f; --ok-soft:#e4f4e8; --warn:#a15c10; --warn-soft:#fbeedd;
  --radius:18px; --radius-sm:11px;
  --shadow:0 2px 8px rgba(0,0,0,.04), 0 10px 30px -12px rgba(0,0,0,.10);
  --shadow-lg:0 18px 60px -18px rgba(0,0,0,.22);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --maxw:1180px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#000000; --card:#1c1c1e; --card-2:#151517;
    --ink:#f5f5f7; --ink-soft:#c7c7cc; --muted:#98989f; --faint:#69696e;
    --line:#38383c; --line-soft:#2a2a2d;
    --accent:#2997ff; --accent-hover:#43a5ff; --accent-soft:#12324e; --accent-ink:#6cb6ff;
    --ok:#5cc273; --ok-soft:#17301c; --warn:#e0a15b; --warn-soft:#33260f;
    --shadow:0 2px 10px rgba(0,0,0,.5), 0 12px 36px -14px rgba(0,0,0,.7);
    --shadow-lg:0 20px 64px -18px rgba(0,0,0,.8);
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  line-height:1.5; font-size:15px; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
h1,h2,h3{font-weight:600;letter-spacing:-.021em}

/* ============================================================ LAYOUT / CHROME */
.appbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid var(--line);
}
.appbar-in{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;flex-direction:column;line-height:1.15;flex-shrink:0;cursor:pointer}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.02em}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.appbar .spacer{flex:1}
.searchwrap{position:relative;flex:1;max-width:440px}
.searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search{
  width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:999px;
  background:var(--card);transition:border-color .15s,box-shadow .15s;font-size:14px;
}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;
  border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500;
  transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;
}
.btn:hover{background:var(--card-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--card-2)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.icon-btn:hover{background:var(--card-2)}
.icon-btn svg{width:17px;height:17px}

main{max-width:var(--maxw);margin:0 auto;padding:26px 20px 80px}

/* ============================================================ LIBRARY */
.lib-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.lib-head h2{font-family:var(--serif);font-size:26px}
.lib-head .count{color:var(--muted);font-size:13px}

.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;color:var(--ink-soft);transition:all .13s;display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .x{font-size:14px;line-height:1;opacity:.7}
.chip.sel-clear{color:var(--accent-ink);border-color:var(--accent-soft);background:var(--accent-soft)}

.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:22px;overflow:hidden}
.panel-head{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;font-size:12px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
}
.panel-head .caret{margin-left:auto;transition:transform .18s;width:14px;height:14px}
.panel[data-open="false"] .caret{transform:rotate(-90deg)}
.panel[data-open="false"] .panel-body{display:none}
.panel-body{padding:4px 16px 16px}

.chord-grid{display:flex;flex-wrap:wrap;gap:7px}
.chord-key{
  min-width:44px;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--line);
  background:var(--card);font-family:var(--mono);font-size:13px;text-align:center;transition:all .12s;
}
.chord-key:hover{border-color:var(--accent)}
.chord-key[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chord-mode{display:flex;gap:6px;margin-top:14px;align-items:center;flex-wrap:wrap}
.seg-ctrl{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg-ctrl button{padding:6px 13px;font-size:12px;color:var(--ink-soft)}
.seg-ctrl button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chord-hint{font-size:12px;color:var(--muted);margin-left:4px}

/* song cards */
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.songs.list-view{grid-template-columns:1fr}
.card{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px 19px;
  text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .16s,box-shadow .16s,transform .08s;
  position:relative;width:100%;
}
.card:hover{border-color:transparent;box-shadow:var(--shadow)}
.card:active{transform:scale(.992)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-family:var(--serif);font-size:17.5px;font-weight:600;line-height:1.25}
.card .artist{color:var(--ink-soft);font-size:13px;margin-top:1px}
.card .fav{flex-shrink:0;width:26px;height:26px;display:grid;place-items:center;border-radius:999px;color:var(--faint)}
.card .fav:hover{background:var(--card-2)}
.card .fav.on{color:var(--accent)}
.card-chords{display:flex;flex-wrap:wrap;gap:5px}
.pill{
  font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:6px;
  background:var(--card-2);color:var(--ink-soft);border:1px solid var(--line-soft);
}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:2px}
.dot{width:3px;height:3px;border-radius:999px;background:var(--faint)}

.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty h3{font-family:var(--serif);font-size:19px;color:var(--ink);margin-bottom:6px;font-weight:600}
.empty p{font-size:14px;max-width:340px;margin:0 auto}

.toolbar-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sortsel{padding:7px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);font-size:12.5px}
.viewtoggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.viewtoggle button{padding:7px 10px;display:grid;place-items:center}
.viewtoggle button svg{width:15px;height:15px}
.viewtoggle button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ============================================================ SONG VIEW */
.song-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft)}
.back:hover{color:var(--ink)}
.song-nav .spacer{flex:1}

.song-head{margin-bottom:18px}
.song-head h1{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.song-head .by{font-size:15px;color:var(--ink-soft);margin-top:4px}
.song-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.song-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.song-facts{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;align-items:center}
.fact{font-size:12px;color:var(--ink-soft);background:var(--card-2);border:1px solid var(--line-soft);padding:3px 9px;border-radius:999px}
.fact.chord{font-family:var(--mono);cursor:pointer}
.fact.chord:hover{border-color:var(--accent);color:var(--accent-ink)}

.pane{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.pane-head{
  padding:11px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--card-2)
}
.pane-head .ph-actions{margin-left:auto;display:flex;gap:6px;align-items:center}
.pane-body{padding:20px 20px 26px}

/* ============================================================ CHORD/LYRIC RENDER */
.sheet{font-size:var(--lyric-size,16px);line-height:1.85;color:var(--ink);font-family:var(--sans)}
.sheet .sec{
  font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink);
  font-weight:700;margin:1.5em 0 .55em;padding-bottom:.2em;border-bottom:1px solid var(--line-soft);
}
.sheet .sec:first-child{margin-top:0}
.sheet .line{display:flex;flex-wrap:wrap;align-items:flex-end;margin:.15em 0;min-height:1em}
.sheet .line.blank{height:.9em}
.sheet .seg{display:inline-flex;flex-direction:column;justify-content:flex-end}
.sheet .chd{
  font-family:var(--mono);font-size:.74em;font-weight:600;line-height:1.4;color:var(--accent);
  letter-spacing:.01em;white-space:pre;height:1.5em;
}
.sheet .chd:empty{height:1.5em}
.sheet .lyr{white-space:pre-wrap}
.sheet .seg.cho{margin-right:.55em}
.sheet .seg.cho .lyr{min-width:.2em}
.sheet .seg.cho .chd{padding-right:.15em}
.sheet .tab{font-family:var(--mono);font-size:.62em;line-height:1.4;white-space:pre;overflow-x:auto;margin:.5em 0 .8em;
  padding:.7em .9em;background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;color:var(--ink-soft)}
.sheet.chords-hidden .chd{display:none}
.sheet.chords-hidden .line{align-items:baseline}


/* ============================================================ NOTES */
.notes-block{margin-top:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px 18px}
.notes-block h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.notes-block p{font-size:14px;color:var(--ink-soft);white-space:pre-wrap}

/* ============================================================ PRACTICE MODE */
.practice{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column}
.practice-top{
  display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 90%,transparent);flex-wrap:wrap
}
.practice-top h2{font-family:var(--serif);font-size:17px;font-weight:600}
.practice-top .by{font-size:12.5px;color:var(--muted)}
.practice-top .spacer{flex:1}
.practice-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.practice-inner{max-width:820px;margin:0 auto;padding:36px 26px 40vh}
.practice .sheet{--lyric-size:22px;line-height:2}
.practice .sheet .chd{color:var(--accent);font-weight:700}
.practice-bar{
  display:flex;align-items:center;justify-content:center;gap:14px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap
}
.practice-bar .group{display:inline-flex;align-items:center;gap:8px}
.font-ctrl{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.font-ctrl button{padding:7px 13px;font-size:13px}
.font-ctrl button:hover{background:var(--card-2)}
.font-ctrl .lbl{padding:0 8px;font-size:12px;color:var(--muted);min-width:40px;text-align:center}
.switch{display:inline-flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft)}
.switch input{position:absolute;opacity:0;pointer-events:none}
.track{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex-shrink:0}
.track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);transition:transform .16s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(18px)}
.speed{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.speed input[type=range]{width:110px;accent-color:var(--accent)}
.pnav{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.pnav:hover{background:var(--card-2)}
.pnav:disabled{opacity:.35;cursor:not-allowed}
.pnav svg{width:16px;height:16px}

.tuner-card{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:18px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--card-2);text-decoration:none;color:inherit;transition:box-shadow .16s,border-color .16s}
.tuner-card:hover{box-shadow:var(--shadow);border-color:transparent}
.tuner-ico{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.tuner-ico svg{width:20px;height:20px}
.tuner-txt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tuner-txt b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.tuner-txt span{font-size:12.5px;color:var(--muted)}
.tuner-strings{display:flex;gap:6px;margin-left:auto}
.tuner-go{font-size:13px;color:var(--accent-ink);font-weight:500;white-space:nowrap}
@media (max-width:680px){ .tuner-strings{display:none} .tuner-go{margin-left:auto} }

/* ============================================================ CHORD STRIP (always-visible row of chord diagrams) */
.song-stack{display:grid;gap:18px;max-width:860px}
.chordstrip-wrap{position:sticky;top:0;z-index:30;margin:0 -20px 18px;padding:8px 20px 10px;
  background:color-mix(in srgb,var(--paper) 93%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid var(--line-soft)}
.chordstrip{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chordstrip::-webkit-scrollbar{display:none}
.cs-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 9px 4px;
  border:1px solid var(--line-soft);border-radius:14px;background:var(--card)}
.cs-name{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink)}
.cs-dia svg{display:block;width:58px;height:auto}
.cs-none{height:40px;width:50px;display:grid;place-items:center;color:var(--faint);font-size:18px}
.chordstrip.center .cs-item:first-child{margin-left:auto}
.chordstrip.center .cs-item:last-child{margin-right:auto}
body[data-route="song"] .appbar{position:static}      /* the chord strip takes over the top of the screen while you play */
.practice .chordstrip{padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card-2)}

/* ============================================================ TUNER */
.tn-panel{max-width:560px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:22px 22px 24px;box-shadow:var(--shadow)}
.tn-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.mini{width:30px;height:30px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;background:var(--card);font-size:16px;line-height:1}
.mini:hover{background:var(--card-2)}
.tn-a4{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tn-read{text-align:center;padding:14px 0 4px}
.tn-notewrap{display:inline-flex;align-items:flex-start;justify-content:center;gap:2px}
.tn-note{font-size:88px;line-height:1;font-weight:600;letter-spacing:-.04em;color:var(--ink);transition:color .15s}
.tn-oct{font-size:22px;color:var(--muted);margin-top:12px}
.tn-sub{font-family:var(--mono);font-size:13px;color:var(--muted);min-height:20px;margin-top:6px}
.tn-meter{position:relative;margin:18px 6px 6px;padding:0 22px}
.tn-track{position:relative;height:44px;border-radius:12px;background:var(--card-2);border:1px solid var(--line-soft);overflow:hidden}
.tn-flat,.tn-sharp{position:absolute;top:50%;transform:translateY(-50%);font-size:18px;color:var(--faint)}
.tn-flat{left:0}.tn-sharp{right:0}
.tick{position:absolute;bottom:0;width:1px;height:10px;background:var(--line)}
.tick.mid{height:100%;width:2px;background:var(--line);opacity:.9;transform:translateX(-1px)}
.tn-needle{position:absolute;top:6px;bottom:6px;width:4px;margin-left:-2px;border-radius:4px;background:var(--accent);transition:left .12s ease-out,background .15s,opacity .15s}
.tn-needle.ok{background:var(--ok)} .tn-needle.idle{opacity:.18;background:var(--faint)}
.tn-msg{text-align:center;font-size:14px;color:var(--ink-soft);min-height:22px;margin:12px 0 18px}
.tn-panel[data-state="ok"] .tn-note{color:var(--ok)}
.tn-panel[data-state="ok"] .tn-msg{color:var(--ok);font-weight:600}
.tn-strings{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tn-str{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;border:1px solid var(--line);border-radius:16px;background:var(--card);transition:all .12s}
.tn-str b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.tn-str small{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.tn-str:hover{background:var(--card-2)}
.tn-str.hit{border-color:var(--accent);background:var(--accent-soft)}
.tn-str.lock{outline:2px solid var(--accent);outline-offset:-2px}
.tn-panel[data-state="ok"] .tn-str.hit{border-color:var(--ok);background:var(--ok-soft)}
.tn-foot{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.tn-hint{font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft)}
.tn-start{width:100%;justify-content:center;margin-top:20px;padding:13px;font-size:15px}
.tn-start.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
@media (max-width:480px){ .tn-note{font-size:72px} .tn-panel{padding:18px 14px 20px} .tn-strings{gap:7px} }

/* ============================================================ MODAL / FORMS */
.overlay{
  position:fixed;inset:0;z-index:90;background:rgba(30,27,24,.42);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;
}
.modal{
  width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow-lg);overflow:hidden;
}
.modal.wide{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--serif);font-size:19px}
.modal-body{padding:20px 22px;max-height:70vh;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 22px;border-top:1px solid var(--line);background:var(--card-2)}
.close-x{width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.close-x:hover{background:var(--card-2)}

.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px}
.field .hint{font-weight:400;color:var(--muted);letter-spacing:0}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);font-size:13.5px;
}
.field textarea{resize:vertical;min-height:90px;font-family:var(--mono);font-size:12.5px;line-height:1.7}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.chordedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper)}
.chordedit .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 4px 4px 9px;font-size:12px}
.chordedit .pill button{font-size:14px;line-height:1;color:var(--muted);width:16px}
.chordedit input{border:none;background:none;flex:1;min-width:80px;padding:4px;font-family:var(--mono);font-size:12.5px}
.chordedit input:focus{outline:none}
.sheet-rows{display:flex;flex-direction:column;gap:8px}
.sheet-row{display:grid;grid-template-columns:88px 1fr 1fr auto;gap:8px;align-items:center}
.sheet-row select,.sheet-row input{padding:7px 9px;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.sheet-row button{color:var(--muted);padding:4px 8px}
.checks{display:flex;gap:20px;flex-wrap:wrap;margin-top:4px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.danger{color:var(--accent-ink)}
.btn.danger-btn{border-color:var(--accent-soft);color:var(--accent-ink)}
.btn.danger-btn:hover{background:var(--accent-soft)}

/* chord diagram popover */
.chordpop{
  position:absolute;z-index:95;background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lg);padding:14px;width:150px;text-align:center;
}
.chordpop h5{font-family:var(--mono);font-size:14px;margin-bottom:8px}
.chordpop svg{display:block;margin:0 auto}
.chordpop .none{font-size:12px;color:var(--muted);padding:10px 0}

.settings-sec{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:18px 20px;margin-bottom:16px}
.settings-sec h3{font-family:var(--serif);font-size:17px;margin-bottom:4px}
.settings-sec p{font-size:13px;color:var(--muted);margin-bottom:14px}
.settings-sec .row{display:flex;gap:10px;flex-wrap:wrap}
.cat-list{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.cat-list .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px}
.cat-list .pill button{color:var(--muted);width:16px;font-size:14px}
.src-note{font-size:12px;color:var(--muted);line-height:1.7}
.src-note code{font-family:var(--mono);font-size:11px;background:var(--card-2);padding:1px 5px;border-radius:4px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:13px;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink-soft);background:var(--card)}

/* ============================================================ RESPONSIVE */
@media (max-width:900px){
}
@media (max-width:680px){
  .appbar-in{flex-wrap:wrap;gap:10px;padding:12px 15px}
  .chordstrip-wrap{margin:0 -15px 14px;padding:6px 15px 8px}
  /* practice mode on a phone: leave as much room as possible for the lyrics */
  .practice-top{padding:8px 12px;gap:8px}
  .practice-top .spacer{display:none}
  .practice-top > div:last-child{margin-left:auto}
  .practice-bar{gap:8px 12px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));justify-content:space-between}
  .practice-bar .group:nth-child(3){order:5;width:100%;justify-content:center}
  .cs-dia svg{width:52px} .cs-item{padding:5px 7px 3px}
  .searchwrap{order:3;max-width:none;flex-basis:100%}
  .brand b{font-size:18px}
  main{padding:20px 15px 90px}
  .lib-head h2{font-size:22px}
  .song-head h1{font-size:25px}
  .songs{grid-template-columns:1fr}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .sheet-row{grid-template-columns:1fr 1fr;grid-auto-flow:row}
  .practice-inner{padding:26px 18px 45vh}
  .practice .sheet{--lyric-size:20px}
  .modal-body{max-height:64vh}
}
@media print{
  .appbar,.song-nav,.song-actions,.chordstrip-wrap,.pane-head,.notes-block{display:none!important}
  .pane{border:none}
  body{background:#fff}
}
</style>

const uid = () => "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const deaccent = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");
const fold = s => deaccent(String(s||"")).toLowerCase().trim();
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const debounce = (fn, ms=180) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };
// Encode a relative file path for use as a URL: keeps "/" but escapes spaces,
// "#", "?" etc. Absolute URLs (http:, file:) are passed straight through.
const encPath = p => /^[a-z]+:/i.test(p||"") ? p : String(p||"").split("/").map(encodeURIComponent).join("/");
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
const CHORD_TOKEN = /^[A-G](#|b)?(maj|min|m|sus|dim|aug|add|M)?\d{0,2}(sus[24]|add\d|maj7|M7)?(\/[A-G](#|b)?)?$/;
const isChord = t => CHORD_TOKEN.test(String(t||"").trim());

/* ------------------------------------------------------------------ DATA (seed) */
const SEED = (() => {
  try { return JSON.parse($("#seed-data").textContent || "[]"); }
  catch(e){ console.error("seed parse failed", e); return []; }
})();
const DEFAULT_CATEGORIES = (() => {
  const base = ["Portuguese","English","Spanish","French","Folk","Pop","Rock","Film & TV","Christmas","Traditional","Campfire","Other"];
  const fromSeed = [...new Set(SEED.map(s => s.category).filter(Boolean))];
  return [...new Set([...base, ...fromSeed])];
})();

/* ==========================================================================
   STORE  —  the only module that touches persistence.
   Every method is written so it can become `async` (return a Promise) with no
   change to callers: the LIBRARY / SONG / FORM code already `await`s nothing
   critical and re-reads through these getters.
   ========================================================================== */
const Store = (() => {
  // v2 keys: the library was reset to empty, so songs cached under the old v1 keys are ignored.
  const K = { songs:"music.songs.v2", cats:"music.categories.v2", prefs:"music.prefs.v1", recent:"music.recent.v2",
              patches:"music.patches.v2", deleted:"music.deleted.v2" };
  const DEFAULT_PREFS = { view:"grid", sort:"title", chordMode:"contains", showChords:true, fontStep:0, autoscrollSpeed:3, tuning:"standard", a4:440 };

  const read = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ toast("Storage full — export a backup"); return false; } };

  // one-time normalisation so every record has the full schema
  function normalize(s){
    return {
      id: s.id || uid(),
      title: s.title || "Untitled",
      artist: s.artist || "Unknown",
      category: s.category || "Other",
      subcategory: s.subcategory || "",
      language: s.language || "",
      difficulty: s.difficulty || "",
      instrument: s.instrument || "Ukulele",
      key: s.key || "",
      capo: Number(s.capo) || 0,
      tuning: s.tuning || "gCEA",
      chords: Array.isArray(s.chords) ? s.chords.slice() : [],
      lyrics: s.lyrics || "",
      lyricsWithChords: s.lyricsWithChords || s.lyrics || "",
      sheetMusic: Array.isArray(s.sheetMusic) ? s.sheetMusic.map(x => ({ type:x.type||"pdf", label:x.label||"", src:x.src||"" })) : [],
      tags: Array.isArray(s.tags) ? s.tags.slice() : [],
      notes: s.notes || "",
      favorite: !!s.favorite,
      createdAt: s.createdAt || nowISO(),
      updatedAt: s.updatedAt || s.createdAt || nowISO(),
    };
  }

  /* The library = songs published with the app (SEED, in this file) + whatever this browser adds.
     - _mine     songs you added/imported here (full records)
     - _patches  your edits to published songs, stored as ONLY the changed fields — so when a published
                 song is corrected in the repo, fields you never touched pick up the fix
     - _deleted  published songs you removed
     New published songs therefore always show up, even in a browser that already has saved data. */
  let _mine = null, _patches = null, _deleted = null, _songs = null, _cats = null;
  function load(){ if (_mine) return; _mine = read(K.songs, []); _patches = read(K.patches, {}); _deleted = read(K.deleted, []); }
  function rebuild(){
    load();
    const own = new Set(_mine.map(s => s.id)), gone = new Set(_deleted);
    const base = SEED.filter(s => !own.has(s.id) && !gone.has(s.id)).map(s => ({ ...s, ...(_patches[s.id] || {}) }));
    _songs = [..._mine, ...base].map(normalize);
  }
  function songs(){ if (!_songs) rebuild(); return _songs; }
  function save(){ write(K.songs, _mine); write(K.patches, _patches); write(K.deleted, _deleted); rebuild(); }
  const seedSong = id => SEED.find(s => s.id === id);

  return {
    /* --- songs --- */
    getSongs(){ return songs().slice(); },
    getSong(id){ return songs().find(s => s.id === id) || null; },
    addSong(data){
      load();
      const s = normalize({ ...data, id: uid(), createdAt: nowISO(), updatedAt: nowISO() });
      _mine.unshift(s); save(); return s;
    },
    updateSong(id, patch){
      load();
      const cur = songs().find(s => s.id === id); if (!cur) return null;
      const next = normalize({ ...cur, ...patch, id, updatedAt: nowISO() });
      const i = _mine.findIndex(s => s.id === id);
      if (i >= 0) _mine[i] = next;
      else {                                   // a published song: remember only what changed
        const base = normalize(seedSong(id)), d = { ...(_patches[id] || {}) };
        for (const k of Object.keys(patch)){
          if (k === "id" || k === "updatedAt") continue;
          if (JSON.stringify(next[k]) === JSON.stringify(base[k])) delete d[k]; else d[k] = next[k];
        }
        if (Object.keys(d).length) { d.updatedAt = next.updatedAt; _patches[id] = d; } else delete _patches[id];
      }
      save(); return songs().find(s => s.id === id);
    },
    deleteSong(id){
      load();
      _mine = _mine.filter(s => s.id !== id);
      if (seedSong(id) && !_deleted.includes(id)) _deleted.push(id);
      delete _patches[id]; save(); Store.removeRecent(id);
    },
    toggleFavorite(id){ const s = Store.getSong(id); if (s) return Store.updateSong(id, { favorite: !s.favorite }); },

    /* --- categories --- */
    getCategories(){ if (!_cats) _cats = read(K.cats, null) || DEFAULT_CATEGORIES.slice();
      const used = songs().map(s => s.category).filter(Boolean);
      return [...new Set([..._cats, ...used])]; },
    addCategory(name){ name = String(name||"").trim(); if (!name) return; const c = Store.getCategories();
      if (!c.some(x => fold(x) === fold(name))){ c.push(name); _cats = c; write(K.cats, c); } },
    deleteCategory(name){ _cats = Store.getCategories().filter(c => c !== name); write(K.cats, _cats); },

    /* --- preferences --- */
    getPrefs(){ return { ...DEFAULT_PREFS, ...read(K.prefs, {}) }; },
    savePreferences(patch){ write(K.prefs, { ...Store.getPrefs(), ...patch }); },

    /* --- recently used --- */
    getRecent(){ return read(K.recent, []); },
    pushRecent(id){ const r = [id, ...Store.getRecent().filter(x => x !== id)].slice(0, 14); write(K.recent, r); },
    removeRecent(id){ write(K.recent, Store.getRecent().filter(x => x !== id)); },

    /* --- data lifecycle --- */
    exportAll(){ return { app:"my-music", version:1, exportedAt: nowISO(),
      songs: Store.getSongs(), categories: Store.getCategories(), preferences: Store.getPrefs() }; },
    importAll(obj, mode){
      load();
      const incoming = (obj.songs || []).map(normalize);
      if (mode === "replace"){
        _mine = incoming; _patches = {};
        const keep = new Set(incoming.map(s => s.id));
        _deleted = SEED.map(s => s.id).filter(id => !keep.has(id));
      } else {
        const byId = new Map(_mine.map(s => [s.id, s]));
        for (const s of incoming){ byId.set(s.id, s); _deleted = _deleted.filter(id => id !== s.id); }
        _mine = [...byId.values()];
      }
      save();
      if (Array.isArray(obj.categories) && obj.categories.length){ _cats = [...new Set(obj.categories)]; write(K.cats, _cats); }
      if (obj.preferences) Store.savePreferences(obj.preferences);
      return songs().length;
    },
    /** drop everything stored in this browser: back to exactly the songs published with the app */
    resetLibrary(){ _mine = []; _patches = {}; _deleted = []; save();
      _cats = DEFAULT_CATEGORIES.slice(); write(K.cats, _cats);
      write(K.recent, []); }
  };
})();

/* ==========================================================================
   STATE  —  transient view state (filters, search). Persisted bits live in prefs.
   ========================================================================== */
const State = {
  q: "",
  filter: { kind:"all", value:null },   // all | favorites | recent | category | artist | language | difficulty
  chords: new Set(),
  get prefs(){ return Store.getPrefs(); },
  set prefs(p){ Store.savePreferences(p); },
};

/* ==========================================================================
   SEARCH  —  forgiving, accent/case-insensitive, chord-aware.
   ========================================================================== */
function searchIndex(s){
  return fold([ s.title, s.artist, s.category, s.subcategory, s.language, s.difficulty,
                s.instrument, s.tags.join(" "), s.chords.join(" "), s.lyrics ].join("  "));
}
const asChord = t => { t = String(t||"").trim(); return isChord(t) ? t : (isChord(t[0]?.toUpperCase() + t.slice(1)) ? t[0].toUpperCase() + t.slice(1) : null); };
function songMatchesQuery(s, q){
  const raw = String(q||"").trim();
  if (!raw) return true;
  // whole query is a set of chord names → require the song to contain them all
  const rawToks = raw.split(/\s+/);
  const chordToks = rawToks.map(asChord);
  if (rawToks.length >= 1 && chordToks.every(Boolean)){
    const have = new Set(s.chords.map(fold));
    return chordToks.every(c => have.has(fold(c)));
  }
  const idx = searchIndex(s);
  return fold(raw).split(/\s+/).every(tok => idx.includes(tok));
}

/* ==========================================================================
   FILTERS  —  turn State into a song list.
   ========================================================================== */
function applyFilters(){
  let list = Store.getSongs();
  const f = State.filter;

  if (f.kind === "favorites") list = list.filter(s => s.favorite);
  else if (f.kind === "recent"){ const order = Store.getRecent();
    list = order.map(id => list.find(s => s.id === id)).filter(Boolean); }
  else if (f.kind === "category") list = list.filter(s => s.category === f.value);
  else if (f.kind === "artist")   list = list.filter(s => s.artist === f.value);
  else if (f.kind === "language") list = list.filter(s => s.language === f.value);
  else if (f.kind === "difficulty") list = list.filter(s => s.difficulty === f.value);

  if (State.chords.size){
    const want = [...State.chords].map(fold);
    const mode = State.prefs.chordMode;
    list = list.filter(s => {
      const have = new Set(s.chords.map(fold));
      const hasAll = want.every(c => have.has(c));
      if (mode === "only") return hasAll && [...have].every(c => want.includes(c));
      return hasAll;
    });
  }

  list = list.filter(s => songMatchesQuery(s, State.q));

  if (f.kind !== "recent"){
    const sort = State.prefs.sort;
    const cmp = {
      title:  (a,b) => fold(a.title).localeCompare(fold(b.title)),
      artist: (a,b) => fold(a.artist).localeCompare(fold(b.artist)) || fold(a.title).localeCompare(fold(b.title)),
      recent: (a,b) => (b.updatedAt||"").localeCompare(a.updatedAt||""),
      added:  (a,b) => (b.createdAt||"").localeCompare(a.createdAt||""),
    }[sort] || (()=>0);
    list = list.slice().sort(cmp);
  }
  return list;
}

/* ==========================================================================
   ROUTING  —  hash based. #/  ·  #/song/:id  ·  #/practice/:id  ·  #/settings
   ========================================================================== */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [name, ...rest] = h.split("/");
  return { name: name || "library", param: decodeURIComponent(rest.join("/") || "") };
}
function go(path){ location.hash = path; }
function render(){
  closeChordPop();
  const { name, param } = parseHash();
  document.body.dataset.route = name;
  const root = $("#view");
  if (name !== "tuner") Tuner.leave();
  if (name !== "practice") _practiceFrom = null;
  if (name === "song")      return renderSong(root, param);
  if (name === "practice")  return renderPractice(param);
  if (name === "tuner")     return renderTuner(root);
  if (name === "settings")  return renderSettings(root);
  return renderLibrary(root);
}
window.addEventListener("hashchange", render);

/* ==========================================================================
   LIBRARY
   ========================================================================== */
function renderLibrary(root){
  destroyPractice();
  const prefs = State.prefs;
  const all = Store.getSongs();
  const list = applyFilters();

  root.replaceChildren();

  // -- head
  const head = el("div", { class:"lib-head" },
    el("h2", {}, "My Music"),
    el("span", { class:"count" }, `${list.length} of ${all.length} song${all.length===1?"":"s"}`)
  );
  root.append(head);
  root.append(tunerCard());

  // -- primary filter chips
  const artists   = [...new Set(all.map(s => s.artist))].filter(Boolean).sort((a,b)=>fold(a).localeCompare(fold(b)));
  const cats      = [...new Set(all.map(s => s.category))].filter(Boolean).sort();
  const langs     = [...new Set(all.map(s => s.language))].filter(Boolean).sort();
  const diffs     = ["Beginner","Intermediate","Advanced"].filter(d => all.some(s => s.difficulty === d));

  const f = State.filter;
  const chipRow = el("div", { class:"filters" });
  const mkChip = (label, active, on, extra) => {
    const c = el("button", { class:"chip" + (extra?` ${extra}`:""), "aria-pressed": active ? "true":"false", onclick:on }, label);
    return c;
  };
  chipRow.append(mkChip("All Songs", f.kind==="all", () => setFilter("all")));
  chipRow.append(mkChip(`♡ Favorites`, f.kind==="favorites", () => setFilter("favorites")));
  if (Store.getRecent().length) chipRow.append(mkChip("Recently Used", f.kind==="recent", () => setFilter("recent")));

  chipRow.append(dropdownChip("Category", cats, f.kind==="category" ? f.value : null, v => setFilter("category", v)));
  chipRow.append(dropdownChip("Artist", artists, f.kind==="artist" ? f.value : null, v => setFilter("artist", v)));
  if (langs.length) chipRow.append(dropdownChip("Language", langs, f.kind==="language" ? f.value : null, v => setFilter("language", v)));
  if (diffs.length) chipRow.append(dropdownChip("Difficulty", diffs, f.kind==="difficulty" ? f.value : null, v => setFilter("difficulty", v)));

  if (f.kind !== "all" || State.chords.size || State.q){
    chipRow.append(mkChip("Clear ✕", false, clearAll, "sel-clear"));
  }
  root.append(chipRow);

  // -- chord browser
  if (all.some(s => s.chords.length)) root.append(renderChordBrowser(all));   // nothing to browse until a song has chords

  // -- toolbar (sort + view)
  const toolbar = el("div", { class:"toolbar-row" });
  const activeLabel = f.kind === "all" ? "All songs"
    : f.kind === "favorites" ? "Favorites"
    : f.kind === "recent" ? "Recently used"
    : `${f.kind[0].toUpperCase()+f.kind.slice(1)}: ${f.value}`;
  toolbar.append(el("div", { class:"chord-hint" }, activeLabel + (State.chords.size ? ` · chords ${[...State.chords].join(" ")}` : "")));

  const right = el("div", { style:"display:flex;gap:10px;align-items:center" });
  const sortSel = el("select", { class:"sortsel", "aria-label":"Sort",
    onchange:e => { State.prefs = { sort:e.target.value }; renderLibrary(root); } });
  [["title","Title A–Z"],["artist","Artist A–Z"],["recent","Recently updated"],["added","Recently added"]]
    .forEach(([v,l]) => sortSel.append(el("option", { value:v, selected: prefs.sort===v }, l)));
  right.append(sortSel);

  const vt = el("div", { class:"viewtoggle", role:"group", "aria-label":"View" });
  vt.append(el("button", { "aria-pressed": prefs.view==="grid"?"true":"false", "aria-label":"Grid view",
    onclick:() => { State.prefs={view:"grid"}; renderLibrary(root); }, html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>' }));
  vt.append(el("button", { "aria-pressed": prefs.view==="list"?"true":"false", "aria-label":"List view",
    onclick:() => { State.prefs={view:"list"}; renderLibrary(root); }, html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>' }));
  right.append(vt);
  toolbar.append(right);
  root.append(toolbar);

  // -- song list / empty states
  if (!list.length){ root.append(emptyState()); return; }
  const grid = el("div", { class:"songs" + (prefs.view==="list" ? " list-view":"") });
  const frag = document.createDocumentFragment();
  list.forEach(s => frag.append(songCard(s)));
  grid.append(frag);
  root.append(grid);
}

function setFilter(kind, value=null){ State.filter = { kind, value }; renderLibrary($("#view")); }

// a chip that opens a native <select> for long option lists
function dropdownChip(label, options, current, onPick){
  if (!options.length) return document.createTextNode("");
  const wrap = el("span", { style:"position:relative;display:inline-flex" });
  const chip = el("button", { class:"chip", "aria-pressed": current ? "true":"false" },
    current ? `${label}: ${current}` : label,
    el("span", { "aria-hidden":"true", style:"opacity:.5" }, " ▾"));
  const sel = el("select", { "aria-label":label,
    style:"position:absolute;inset:0;opacity:0;width:100%;cursor:pointer",
    onchange:e => onPick(e.target.value || null) });
  sel.append(el("option", { value:"" }, `All ${label.toLowerCase()}s`));
  options.forEach(o => sel.append(el("option", { value:o, selected:o===current }, o)));
  wrap.append(chip, sel);
  return wrap;
}

function songCard(s){
  const card = el("button", { class:"card", onclick:() => go(`#/song/${s.id}`) });
  const fav = el("span", { class:"fav" + (s.favorite ? " on":""), role:"button", tabindex:"0",
    "aria-label": s.favorite ? "Remove from favorites" : "Add to favorites",
    onclick:e => { e.stopPropagation(); Store.toggleFavorite(s.id); renderLibrary($("#view")); },
    onkeydown:e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); e.stopPropagation(); Store.toggleFavorite(s.id); renderLibrary($("#view")); } },
    html: s.favorite
      ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 21s-7-4.35-9.5-8.5C.8 9.5 2 5.5 5.5 5.5 8 5.5 12 8.5 12 8.5s4-3 6.5-3c3.5 0 4.7 4 3 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>'
      : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.35-9.5-8.5C.8 9.5 2 5.5 5.5 5.5 8 5.5 12 8.5 12 8.5s4-3 6.5-3c3.5 0 4.7 4 3 7-2.5 4.15-9.5 8.5-9.5 8.5z"/></svg>' });

  card.append(el("div", { class:"card-top" },
    el("div", {}, el("h3", {}, s.title), el("div", { class:"artist" }, s.artist)),
    fav));

  if (s.chords.length){
    const cc = el("div", { class:"card-chords" });
    s.chords.slice(0, 8).forEach(c => cc.append(el("span", { class:"pill" }, c)));
    if (s.chords.length > 8) cc.append(el("span", { class:"pill" }, `+${s.chords.length-8}`));
    card.append(cc);
  }

  const meta = el("div", { class:"card-meta" });
  const bits = [s.category, s.difficulty, s.instrument, s.capo ? `Capo ${s.capo}` : null, s.key ? `Key ${s.key}` : null].filter(Boolean);
  bits.forEach((b,i) => { if (i) meta.append(el("span", { class:"dot" })); meta.append(el("span", {}, b)); });
  card.append(meta);
  return card;
}

function emptyState(){
  const empty = el("div", { class:"empty" });
  if (State.q){
    empty.append(el("h3", {}, "No songs found"),
      el("p", {}, "Try another title, artist or chord."));
  } else if (State.filter.kind === "favorites"){
    empty.append(el("h3", {}, "No favorites yet"),
      el("p", {}, "Tap the heart on a song to keep it here for quick access."));
  } else if (State.filter.kind === "recent"){
    empty.append(el("h3", {}, "Nothing played yet"),
      el("p", {}, "Songs you open will show up here."));
  } else if (State.chords.size){
    empty.append(el("h3", {}, "No songs with those chords"),
      el("p", {}, "Remove a chord, or switch to “contains these chords”."));
  } else {
    empty.append(el("h3", {}, "Your library is empty"),
      el("p", {}, "Add your first song, or import a backup from Settings."));
  }
  return empty;
}

/* ==========================================================================
   CHORD BROWSER
   ========================================================================== */
function renderChordBrowser(all){
  const counts = {};
  all.forEach(s => s.chords.forEach(c => counts[c] = (counts[c]||0) + 1));
  const chords = Object.keys(counts).sort((a,b) => counts[b]-counts[a] || a.localeCompare(b));

  const panel = el("div", { class:"panel", dataset:{ open: State._chordPanelOpen ? "true":"false" } });
  const caret = '<svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>';
  const headBtn = el("button", { class:"panel-head", "aria-expanded": State._chordPanelOpen ? "true":"false",
    onclick:() => { State._chordPanelOpen = !State._chordPanelOpen; renderLibrary($("#view")); },
    html: `Chords${State.chords.size ? ` · ${[...State.chords].join(" ")}` : ""} ${caret}` });
  panel.append(headBtn);

  const body = el("div", { class:"panel-body" });
  const grid = el("div", { class:"chord-grid" });
  chords.forEach(c => {
    const on = State.chords.has(c);
    grid.append(el("button", { class:"chord-key", "aria-pressed": on ? "true":"false",
      title:`${counts[c]} song${counts[c]===1?"":"s"}`,
      onclick:() => { on ? State.chords.delete(c) : State.chords.add(c); renderLibrary($("#view")); } }, c));
  });
  body.append(grid);

  const mode = el("div", { class:"chord-mode" });
  const seg = el("div", { class:"seg-ctrl", role:"group", "aria-label":"Chord match mode" });
  const cm = State.prefs.chordMode;
  seg.append(el("button", { "aria-pressed": cm==="contains"?"true":"false",
    onclick:() => { State.prefs={chordMode:"contains"}; renderLibrary($("#view")); } }, "Contains these chords"));
  seg.append(el("button", { "aria-pressed": cm==="only"?"true":"false",
    onclick:() => { State.prefs={chordMode:"only"}; renderLibrary($("#view")); } }, "Only these chords"));
  mode.append(seg);
  mode.append(el("span", { class:"chord-hint" },
    cm === "only" ? "Songs that use nothing outside your selection." : "Songs that include every selected chord (plus maybe others)."));
  if (State.chords.size) mode.append(el("button", { class:"btn sm ghost",
    onclick:() => { State.chords.clear(); renderLibrary($("#view")); } }, "Reset chords"));
  body.append(mode);
  panel.append(body);
  return panel;
}

/* ==========================================================================
   CHORD/LYRIC PARSING & RENDERING  — the heart of the app.
   `lyricsWithChords` uses inline [Chord] markers:  "[C]Now I've [Am]heard"
   A line that is exactly "[Something]" where Something is NOT a chord is a
   section header (e.g. [Chorus], [Verse 1]).
   ========================================================================== */
function parseSongText(text){
  const lines = String(text || "").replace(/\r/g,"").split("\n");
  const out = [];
  for (let raw of lines){
    const t = raw.trim();
    if (!t){ out.push({ type:"blank" }); continue; }

    // guitar-style tab line ("E |--12---10--|") -> shown as-is in a monospace block
    if (/^[A-Ga-g]?\s?\|[-\dxX/\\hpbrs~()*|\s]*$/.test(t) && /--/.test(t)){ out.push({ type:"tab", text: raw.trimEnd() }); continue; }

    // whole line is a bracketed label that isn't a chord  ->  section header
    const only = t.match(/^\[([^\]]+)\]$/);
    if (only && !isChord(only[1].trim())){ out.push({ type:"section", label: only[1].trim() }); continue; }

    // line STARTS with a non-chord label, then more content  ("[Intro] D  G  A")
    const lead0 = t.match(/^\[([^\]]+)\]\s*(.*)$/);
    if (lead0 && !isChord(lead0[1].trim())){
      out.push({ type:"section", label: lead0[1].trim() });
      if (!lead0[2].trim()) continue;
      raw = lead0[2];
    }

    // split into [chord]text segments; keep any leading text before the first chord
    const segs = [];
    const re = /\[([^\]]+)\]/g;
    let last = 0, m, lead = "";
    while ((m = re.exec(raw)) !== null){
      const before = raw.slice(last, m.index);
      if (segs.length === 0 && before) lead = before;
      else if (segs.length) segs[segs.length-1].text += before;
      segs.push({ chord: m[1].trim(), text: "" });
      last = re.lastIndex;
    }
    const tail = raw.slice(last);
    if (segs.length) segs[segs.length-1].text += tail;
    out.push(segs.length ? { type:"lyric", lead, segs } : { type:"lyric", lead: raw, segs: [] });
  }
  return out;
}

function renderSheet(text, { interactive=true } = {}){
  const wrap = el("div", { class:"sheet" });
  let tabBlock = null;
  parseSongText(text).forEach(node => {
    if (node.type === "tab"){
      if (!tabBlock){ tabBlock = el("pre", { class:"tab", tabindex:"0", "aria-label":"Tab" }); wrap.append(tabBlock); }
      tabBlock.append(node.text + "\n"); return;
    }
    tabBlock = null;
    if (node.type === "blank"){ wrap.append(el("div", { class:"line blank" })); return; }
    if (node.type === "section"){ wrap.append(el("div", { class:"sec" }, node.label)); return; }
    const line = el("div", { class:"line" });
    if (node.lead){
      line.append(el("span", { class:"seg" }, el("span", { class:"chd" }, ""), el("span", { class:"lyr" }, node.lead)));
    }
    node.segs.forEach(seg => {
      const cho = !seg.text.trim();
      const s = el("span", { class:"seg" + (cho ? " cho":"") });
      const ch = el("span", { class:"chd" }, seg.chord);
      if (interactive){ ch.setAttribute("role","button"); ch.tabIndex = 0; ch.style.cursor = "pointer";
        ch.addEventListener("click", e => showChordPop(seg.chord, e.currentTarget));
        ch.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); showChordPop(seg.chord, e.currentTarget); } });
      }
      s.append(ch, el("span", { class:"lyr" }, seg.text || (cho ? " " : "")));
      line.append(s);
    });
    wrap.append(line);
  });
  return wrap;
}

/* ==========================================================================
   CHORD STRIP  —  one row with a fingering diagram for every chord the song uses.
   Used (sticky) on the song page and (fixed under the title bar) in practice mode.
   Diagrams come from the SHAPES table; a chord with no known shape shows its name only.
   ========================================================================== */
function buildChordStrip(song, opts={}){
  const chords = Array.isArray(song.chords) ? song.chords : [];
  if (!chords.length) return null;
  const row = el("div", { class:"chordstrip" + (opts.center ? " center" : ""), role:"list", "aria-label":"Chords in this song" });
  chords.forEach(name => {
    const svg = chordSVG(name);
    row.append(el("div", { class:"cs-item", role:"listitem" },
      el("div", { class:"cs-name" }, name),
      svg ? el("div", { class:"cs-dia", html: svg }) : el("div", { class:"cs-none", title:"No diagram for this chord yet" }, "–")));
  });
  return opts.sticky ? el("div", { class:"chordstrip-wrap" }, row) : row;
}

   PRACTICE MODE  —  digital music stand.

let _practice = null;
let _practiceFrom = null;      // the song practice mode was started on: "Close" always returns there

  location.replace(back);      // replace, so Back doesn't land on a practice screen again
}
function destroyPractice(){
  if (_practice){ cancelAnimationFrame(_practice.raf); clearInterval(_practice.tick);
    if (_practice.wakeLock && _practice.wakeLock.release) _practice.wakeLock.release().catch(()=>{});
    _practice = null; }

  document.body.style.overflow = "";
}
function renderPractice(id){
  const list = applyFilters();

  if (pos < 0){ songList = Store.getSongs(); pos = songList.findIndex(s => s.id === id); }
  const s = songList[pos] || Store.getSong(id);
  if (!s){ go("#/"); return; }
  Store.pushRecent(s.id);
  if (!_practiceFrom) _practiceFrom = s.id;

  destroyPractice();
  document.body.style.overflow = "hidden";
  const prefs = State.prefs;
  let fontStep = prefs.fontStep || 0;
  let scrolling = false;
  let speed = prefs.autoscrollSpeed || 3;

  const rootEl = el("div", { class:"practice" });

  const top = el("div", { class:"practice-top" });
  top.append(el("button", { class:"btn sm ghost", onclick:closePractice }, "✕ Close"));

  inner.append(sheet);
  scroll.append(inner);
  rootEl.append(scroll);

  const bar = el("div", { class:"practice-bar" });

  const prevBtn = el("button", { class:"pnav", "aria-label":"Previous song", disabled: pos<=0,
    onclick:() => step(-1), html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>' });
  const nextBtn = el("button", { class:"pnav", "aria-label":"Next song", disabled: pos>=songList.length-1,
    onclick:() => step(1), html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>' });

  const fontCtrl = el("div", { class:"font-ctrl" });

  );

  const scrollWrap = el("label", { class:"switch" });
  const scrollCb = el("input", { type:"checkbox", onchange:e => { scrolling = e.target.checked; scrolling ? startScroll() : stopScroll(); } });
  scrollWrap.append(scrollCb, el("span", { class:"track" }), el("span", {}, "Auto-scroll"));

  const speedWrap = el("span", { class:"speed" });
  const speedInput = el("input", { type:"range", min:"1", max:"10", value:String(speed), "aria-label":"Scroll speed",

  bar.append(el("div", { class:"group" }, prevBtn, nextBtn),

             el("div", { class:"group" }, scrollWrap, speedWrap),
             el("div", { class:"group" }, favBtn));
  rootEl.append(bar);
  $("#practice-root").replaceChildren(rootEl);
  applyFont();

  function applyFont(){ const size = 22 + fontStep * 2;
    sheet.style.setProperty("--lyric-size", size + "px");
    fLbl.textContent = size + "px"; }
  function persistPractice(){ State.prefs = { fontStep, autoscrollSpeed: speed }; }
  function startScroll(){
    stopScroll();
    let acc = scroll.scrollTop;                 // sub-pixel accumulator
    const last = { t: performance.now() };
    _practice.tick = setInterval(() => {
      const now = performance.now(), dt = Math.min(120, now - last.t); last.t = now;
      if (Math.abs(scroll.scrollTop - acc) > 3) acc = scroll.scrollTop;   // you nudged it by hand: carry on from there
      acc += (4 + speed * 4) * (dt / 1000);   // px/sec: speed 1 → 8, 5 → 24, 10 → 44 (was 24 → 150)
      scroll.scrollTop = acc;
      if (scroll.scrollTop + scroll.clientHeight >= scroll.scrollHeight - 2){
        stopScroll(); scrollCb.checked = false; scrolling = false;
      }

  }
  function stopScroll(){ if (_practice) clearInterval(_practice.tick); }
  function step(dir){
    const np = pos + dir;
    if (np < 0 || np >= songList.length) return;
    location.replace(`#/practice/${songList[np].id}`);   // replace: flipping through songs adds no history
  }

  _practice = { raf:0, tick:0, step, song:s, wakeLock:null };
  // keep the screen awake while practising, if the browser allows it
  if ("wakeLock" in navigator){ navigator.wakeLock.request("screen").then(w => { if (_practice) _practice.wakeLock = w; }).catch(()=>{}); }
}

/* ==========================================================================
   TUNER  —  built-in ukulele tuner (microphone + reference tones).
   detectPitch() is a pure YIN pitch detector so it can be tested without a mic.
   ========================================================================== */
const NOTE_NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
const TUNINGS = {   // [label, midi]  — listed in string order (4th → 1st)
  standard: { label:"Standard · G C E A",        notes:[67,60,64,69] },
  lowg:     { label:"Low G · G C E A",           notes:[55,60,64,69] },
  baritone: { label:"Baritone · D G B E",        notes:[50,55,59,64] },
};
const midiFreq = (m, a4=440) => a4 * Math.pow(2, (m - 69) / 12);
const midiName = m => NOTE_NAMES[((m % 12) + 12) % 12];
const midiOct  = m => Math.floor(m / 12) - 1;
const centsOff = (f, target) => 1200 * Math.log2(f / target);

/** YIN pitch detection. Returns {freq, rms, clarity}; freq is null when silent/unclear. */
function detectPitch(buf, sr, fmin=90, fmax=520){
  const n = buf.length, W = n >> 1;
  let sum = 0; for (let i = 0; i < n; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / n);
  if (rms < 0.008) return { freq:null, rms, clarity:0 };
  const maxTau = Math.min(Math.floor(sr / fmin), W - 1), minTau = Math.max(2, Math.floor(sr / fmax));
  const d = new Float32Array(maxTau + 1);
  for (let tau = 1; tau <= maxTau; tau++){
    let s = 0;
    for (let j = 0; j < W; j++){ const x = buf[j] - buf[j + tau]; s += x * x; }
    d[tau] = s;
  }
  // cumulative mean normalised difference
  let run = 0; d[0] = 1;
  for (let tau = 1; tau <= maxTau; tau++){ run += d[tau]; d[tau] = run ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = minTau; t <= maxTau; t++){
    if (d[t] < 0.12){ while (t + 1 <= maxTau && d[t + 1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 0){                                  // fall back to the deepest dip if it is clear enough
    let best = minTau; for (let t = minTau; t <= maxTau; t++) if (d[t] < d[best]) best = t;
    if (d[best] > 0.25) return { freq:null, rms, clarity:1 - d[best] };
    tau = best;
  }
  let t0 = tau;                                   // parabolic interpolation
  if (tau > 1 && tau < maxTau){
    const a = d[tau - 1], b = d[tau], c = d[tau + 1], den = a - 2 * b + c;
    if (den) t0 = tau + (a - c) / (2 * den);
  }
  return { freq: sr / t0, rms, clarity: 1 - d[tau] };
}

const Tuner = (() => {
  let ctx = null, stream = null, source = null, analyser = null, buf = null, raf = 0, listening = false;
  let ui = null, lock = null, hist = [], lastGood = 0, mutedUntil = 0;

  const prefs = () => State.prefs;
  const tuning = () => TUNINGS[prefs().tuning] || TUNINGS.standard;
  const a4 = () => Number(prefs().a4) || 440;
  const targets = () => tuning().notes.map(m => midiFreq(m, a4()));
  const audio = () => {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  };

  /** pick the string a frequency belongs to (octave-folded, since strings re-enter) */
  function match(freq){
    const t = targets(), idxs = lock != null ? [lock] : t.map((_, i) => i);
    let best = null;
    for (const i of idxs) for (const k of [-1, 0, 1]){
      const c = centsOff(freq * Math.pow(2, k), t[i]);
      if (!best || Math.abs(c) < Math.abs(best.cents)) best = { i, cents:c };
    }
    return best;
  }

  /** feed one detected frequency (or null). Smooths, then updates the UI. */
  function applyReading(freq, now = performance.now()){
    if (!ui) return;
    if (now < mutedUntil){ return paint(null, "Playing reference tone…"); }
    if (freq){
      hist.push(freq); if (hist.length > 5) hist.shift();
      lastGood = now;
      const med = hist.slice().sort((a, b) => a - b)[hist.length >> 1];
      const m = match(med);
      return paint({ ...m, freq: med });
    }
    if (now - lastGood < 500 && hist.length) return;           // hold the last reading briefly
    hist = []; paint(null);
  }

  function paint(r, msg){
    const strs = ui.strings;
    strs.forEach(b => b.classList.remove("hit"));
    if (!r){
      ui.note.textContent = "—"; ui.oct.textContent = ""; ui.sub.textContent = "";
      ui.needle.style.left = "50%"; ui.needle.className = "tn-needle idle";
      ui.root.dataset.state = "idle";
      ui.msg.textContent = msg || (listening ? "Pluck a string…" : "Tap Start, then pluck a string");
      return;
    }
    const m = tuning().notes[r.i];
    strs[r.i].classList.add("hit");
    const c = Math.round(r.cents), ok = Math.abs(r.cents) <= 5;
    ui.note.textContent = midiName(m); ui.oct.textContent = midiOct(m);
    ui.sub.textContent = `${r.freq.toFixed(1)} Hz  ·  ${c > 0 ? "+" : ""}${c}¢`;
    ui.needle.style.left = (50 + Math.max(-50, Math.min(50, r.cents))) + "%";
    ui.needle.className = "tn-needle " + (ok ? "ok" : "off");
    ui.root.dataset.state = ok ? "ok" : (r.cents < 0 ? "low" : "high");
    ui.msg.textContent = lock != null && Math.abs(r.cents) > 150 ? `That doesn’t sound like the ${midiName(m)} string — pluck it, or tap “Auto-detect”`
      : ok ? "In tune ✓" : r.cents < 0 ? "Too low — tighten the string ↑" : "Too high — loosen the string ↓";
  }

  function loop(){
    if (!listening) return;
    analyser.getFloatTimeDomainData(buf);
    const r = detectPitch(buf, ctx.sampleRate);
    applyReading(r.freq && r.clarity > 0.8 ? r.freq : null);
    raf = requestAnimationFrame(loop);
  }

  /** start analysing any WebAudio source node (mic stream, or an oscillator in tests) */
  function listen(node){
    analyser = audio().createAnalyser(); analyser.fftSize = 4096; analyser.smoothingTimeConstant = 0;
    buf = new Float32Array(analyser.fftSize);
    node.connect(analyser); source = node; listening = true; hist = []; lastGood = 0;
    ui && (ui.start.textContent = "Stop", ui.start.classList.add("on"));
    paint(null); loop();
  }

  async function start(){
    if (listening) return stop();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return ui && (ui.msg.textContent = "This browser can’t access a microphone here. Try Chrome or Safari over https (or localhost).");
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    } catch (e){
      return ui && (ui.msg.textContent = e && e.name === "NotAllowedError"
        ? "Microphone blocked. Allow it in the address bar, then tap Start again."
        : "Couldn’t open the microphone (" + (e && e.name || "error") + ").");
    }
    listen(audio().createMediaStreamSource(stream));
  }

  function stop(){
    listening = false; cancelAnimationFrame(raf);
    try { source && source.disconnect(); } catch(e){}
    if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
    source = null; hist = [];
    if (ui){ ui.start.textContent = "Start"; ui.start.classList.remove("on"); paint(null); }
  }

/* ==========================================================================
   CHORD DIAGRAMS  —  ukulele (gCEA). Extension point: add shapes to SHAPES.
   frets: array of 4 numbers  [g,C,E,A]  · 0 = open · -1 = muted · n = fret
   ========================================================================== */
const SHAPES = {
  "C":[0,0,0,3],"C7":[0,0,0,1],"Cmaj7":[0,0,0,2],"C6":[0,0,0,0],"Cadd9":[0,2,0,3],"Cm":[0,3,3,3],"Cm7":[3,3,3,3],
  "D":[2,2,2,0],"D7":[2,2,2,3],"Dm":[2,2,1,0],"Dm7":[2,2,1,3],"Dmaj7":[2,2,2,4],"Dsus4":[0,2,3,0],"Dsus2":[2,2,0,0],
  "E":[4,4,4,0],"E7":[1,2,0,2],"Em":[0,4,3,2],"Em7":[0,2,0,2],"Emaj7":[1,3,0,2],
  "F":[2,0,1,0],"F7":[2,3,1,0],"Fm":[1,0,1,3],"Fmaj7":[2,4,1,3],"Fm7":[1,3,1,3],
  "G":[0,2,3,2],"G7":[0,2,1,2],"Gm":[0,2,3,1],"Gmaj7":[0,2,2,2],"Gsus4":[0,2,3,3],"Gm7":[0,2,1,1],
  "A":[2,1,0,0],"A7":[0,1,0,0],"Am":[2,0,0,0],"Am7":[0,0,0,0],"Amaj7":[1,1,0,0],"Asus4":[2,2,0,0],
  "B":[4,3,2,2],"B7":[2,3,2,2],"Bm":[4,2,2,2],"Bm7":[2,2,2,2],"Bdim":[1,2,1,2],
  "Bb":[3,2,1,1],"Bb7":[1,2,1,1],"Bbm":[3,1,1,1],"A#":[3,2,1,1],
  "Eb":[3,3,3,1],"Ebmaj7":[3,3,3,0],"D#":[3,3,3,1],
  "Ab":[5,3,4,3],"G#":[5,3,4,3],"Abmaj7":[1,3,3,3],
  "Db":[1,1,1,4],"C#":[1,1,1,4],"C#m":[1,4,4,4],
  "F#":[3,1,2,1],"Gb":[3,1,2,1],"F#m":[2,1,2,0],"Gbm":[2,1,2,0],"F#m7":[2,4,2,4],
  "G#m":[4,3,4,2],"Abm":[4,3,4,2],
  "C/B":[4,0,0,3],"G6":[0,2,0,2],"Cm6":[2,3,3,3],"Bbdim":[0,1,0,1],"Adim":[2,3,2,3],"Ddim":[1,2,1,2],
  "A6":[2,4,2,4],"D6":[2,2,2,2],"E6":[1,0,2,0],"F6":[2,2,1,3],"Gadd9":[0,2,0,0],"Fadd9":[0,0,1,0],
};
function chordSVG(name){
  let frets = SHAPES[name];
  if (!frets){ // fall back: drop slash bass, then trim extensions / enharmonic
    const base = name.replace(/\/.*$/, "");                 // C/E -> C, Am/G -> Am
    const cands = [base, name.replace(/maj7/,"M7"), base.replace(/maj7/,"M7"),
                   name.replace(/7$/,""), base.replace(/(sus[24]|add\d|dim|aug|maj7|M7|[469]|7)$/,""),
                   base.replace(/m$/,"")];
    for (const c of cands){ if (c && SHAPES[c]){ frets = SHAPES[c]; break; } }
    if (!frets) return null;
  }
  const W=110, H=120, L=16, T=22, cw=(W-L*2)/3, rows=4, rh=(H-T-14)/rows;
  let p = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(name)} chord diagram">`;
  p += `<rect x="${L}" y="${T}" width="${cw*3}" height="4" rx="1" fill="var(--ink)"/>`;
  for (let i=0;i<4;i++) p += `<line x1="${L+cw*i}" y1="${T}" x2="${L+cw*i}" y2="${T+rh*rows}" stroke="var(--line)" stroke-width="1.4"/>`;
  for (let r=0;r<=rows;r++) p += `<line x1="${L}" y1="${T+rh*r}" x2="${L+cw*3}" y2="${T+rh*r}" stroke="var(--line)" stroke-width="1.4"/>`;
  frets.forEach((f,i) => {
    const x = L + cw*i;
    if (f === -1){ p += `<text x="${x}" y="${T-6}" text-anchor="middle" font-size="11" fill="var(--muted)">×</text>`; }
    else if (f === 0){ p += `<circle cx="${x}" cy="${T-9}" r="4" fill="none" stroke="var(--ink)" stroke-width="1.6"/>`; }
    else { p += `<circle cx="${x}" cy="${T + rh*(f-0.5)}" r="7" fill="var(--accent)"/>`; }
  });
  p += `</svg>`;
  return p;
}
let _chordPop = null;

function modal({ title, body, footer, wide }){
  const root = $("#modal-root");

    el("div", { class:"modal-head" }, el("h3", {}, title),

    el("div", { class:"modal-body" }, body),

  if (footer) box.append(el("div", { class:"modal-foot" }, footer));
  overlay.append(box);
  root.replaceChildren(overlay);

}
function importLibrary(file){
  const reader = new FileReader();
  reader.onload = () => {
    let obj; try { obj = JSON.parse(reader.result); } catch(e){ toast("That file isn’t valid JSON"); return; }
    const songs = obj.songs || (Array.isArray(obj) ? obj : null);
    if (!songs){ toast("No songs found in that file"); return; }
    modal({ title:"Import library", body: el("div", {},
        el("p", {}, `Found ${songs.length} songs in “${esc(file.name)}”.`),
        el("p", { style:"margin-top:8px;color:var(--muted);font-size:13px" }, "Merge keeps your current songs and adds/updates by id. Replace swaps everything.")),
      footer: [
        el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"),
        el("button", { class:"btn", onclick:() => { const n = Store.importAll(obj.songs?obj:{songs}, "merge"); closeModal(); toast(`Merged — ${n} songs`); render(); } }, "Merge"),
        el("button", { class:"btn primary", onclick:() => { const n = Store.importAll(obj.songs?obj:{songs}, "replace"); closeModal(); toast(`Replaced — ${n} songs`); render(); } }, "Replace all"),
      ] });
  };
  reader.readAsText(file);
}
function confirmReset(){
  modal({ title:"Reset my changes", body:
      el("p", {}, "This removes the songs you added in this browser, your edits, favorites and deletions. The library goes back to exactly the songs published with the app. Export a backup first if you want to keep anything."),
    footer: [
      el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"),
      el("button", { class:"btn danger-btn", onclick:() => { Store.resetLibrary(); closeModal(); toast("Back to the published library"); go("#/"); render(); } }, "Reset"),
    ] });
}

/* ==========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================== */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  const route = parseHash();

  if (e.key === "Escape"){
    if (_chordPop) return closeChordPop();
    if ($("#modal-root").hasChildNodes()) return closeModal();
    if (route.name === "practice") return closePractice();
  }
  if (typing){
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  if (e.key === "/"){ e.preventDefault(); $("#search").focus(); $("#search").select(); return; }
  if ($("#modal-root").hasChildNodes()) return;

  if (route.name === "practice" && _practice){
    if (e.key === "ArrowRight"){ e.preventDefault(); _practice.step(1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); _practice.step(-1); }
    if (e.key.toLowerCase() === "f"){ Store.toggleFavorite(_practice.song.id); toast("Favorite toggled"); }
  }
  if (route.name === "song"){
    if (e.key.toLowerCase() === "f"){ Store.toggleFavorite(route.param); render(); }
  }
});

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
$("#search").addEventListener("input", debounce(e => {
  State.q = e.target.value;
  if (parseHash().name !== "library"){ go("#/"); }
  else renderLibrary($("#view"));
}, 140));
$("#search").addEventListener("keydown", e => { if (e.key === "Enter" && parseHash().name !== "library") go("#/"); });
$("#add-btn").addEventListener("click", () => openSongForm(null));
$("#settings-btn").addEventListener("click", () => go("#/settings"));
$("#brand").addEventListener("click", () => go("#/"));
$("#brand").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go("#/"); } });

// first run: seed the store
Store.savePreferences({}); // ensure prefs object exists

render();
</script>
</body>
