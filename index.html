  paintChords();

  // sheet music rows
  const sheetWrap = el("div", { class:"sheet-rows" });
  function paintSheets(){
    sheetWrap.replaceChildren();
    sheets.forEach((sm,i) => {
      const typeSel = el("select", { onchange:e => sm.type = e.target.value });
      [["pdf","PDF"],["image","Image"]].forEach(([v,l]) => typeSel.append(el("option", { value:v, selected:v===sm.type }, l)));
      const lab = el("input", { type:"text", value: sm.label || "", placeholder:"label", oninput:e => sm.label = e.target.value });
      const src = el("input", { type:"text", value: sm.src || "", placeholder:"relative/path/to/file.pdf", oninput:e => sm.src = e.target.value });
      const pick = el("input", { type:"file", accept:".pdf,image/*", style:"display:none",
        onchange:e => { const f = e.target.files[0]; if (f){ sm.src = f.name; sm.type = /\.pdf$/i.test(f.name) ? "pdf":"image"; paintSheets(); } } });
      const pickBtn = el("button", { type:"button", class:"btn sm ghost", onclick:() => pick.click() }, "Pick");
      const del = el("button", { type:"button", "aria-label":"Remove", onclick:() => { sheets.splice(i,1); paintSheets(); } }, "Remove");
      sheetWrap.append(el("div", { class:"sheet-row" }, typeSel, lab, src, el("span",{style:"display:flex;gap:4px"}, pickBtn, del), pick));
    });
    sheetWrap.append(el("button", { type:"button", class:"btn sm", onclick:() => { sheets.push({ type:"pdf", label:"", src:"" }); paintSheets(); } }, "+ Add sheet"));
  }
  paintSheets();

  const body = el("div", {},
    field("Title", fTitle),
    el("div", { class:"grid-2" }, field("Artist", fArtist), field("Category", fCat)),
    el("div", { class:"grid-3" }, field("Subcategory", fSub), field("Language", fLang), field("Difficulty", fDiff)),
    el("div", { class:"grid-3" }, field("Instrument", fInstr), field("Key", fKey), field("Capo", fCapo)),
    el("div", { class:"grid-2" }, field("Tuning", fTuning), field("Tags", fTags, "comma separated")),
    field(el("span",{}, "Chords ", autoChordsBtn), chordBox),
    field("Lyrics + Chords", fLWC, "inline [Chord] markers — this drives the aligned view & practice mode"),
    field("Plain lyrics", fLyrics, "optional — lyrics only, for search / printing"),
    field("Sheet music", sheetWrap, "PDF or image. Path is relative to index.html"),
    field("Notes", fNotes),
    el("label", { class:"check" }, fFav, " Mark as favorite"),
  );

  const save = el("button", { class:"btn primary", onclick:() => {
    if (!fTitle.value.trim()){ fTitle.focus(); toast("A title is required"); return; }
    const data = {
      title: fTitle.value.trim(), artist: fArtist.value.trim() || "Unknown",
      category: fCat.value === "__new" ? (s.category || "Other") : fCat.value,
      subcategory: fSub.value.trim(), language: fLang.value.trim(), difficulty: fDiff.value,
      instrument: fInstr.value.trim(), key: fKey.value.trim(), capo: +fCapo.value || 0,
      tuning: fTuning.value.trim(), chords,
      lyrics: fLyrics.value, lyricsWithChords: fLWC.value,
      sheetMusic: sheets.filter(x => x.src.trim()),
      tags: fTags.value.split(",").map(t => t.trim()).filter(Boolean),
      notes: fNotes.value, favorite: fFav.checked,
    };
    const saved = isEdit ? Store.updateSong(s.id, data) : Store.addSong(data);
    closeModal(); toast(isEdit ? "Song updated" : "Song added");
    go(`#/song/${saved.id}`); render();
  } }, isEdit ? "Save changes" : "Add song");

  const footL = isEdit
    ? el("button", { class:"btn danger-btn", style:"margin-right:auto", onclick:() => confirmDelete(s) }, "Delete song")
    : el("span", { style:"margin-right:auto" });

  modal({ title: isEdit ? "Edit song" : "Add song", wide:true, body,
    footer: [footL, el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"), save] });
}

function confirmDelete(s){
  modal({ title:"Delete song", body: el("div", {},
      el("p", {}, "Delete ", el("b", {}, s.title), " by ", esc(s.artist), "? This can’t be undone."),
      el("p", { style:"margin-top:8px;color:var(--muted);font-size:13px" }, "Tip: keep a backup via Settings → Export Library.")),
    footer: [
      el("button", { class:"btn", onclick:() => openSongForm(s) }, "Cancel"),
      el("button", { class:"btn danger-btn", onclick:() => {
        Store.deleteSong(s.id); closeModal(); toast("Song deleted");
        go("#/"); render();
      } }, "Delete"),
    ] });
}

/* ==========================================================================
   SETTINGS  —  IMPORT / EXPORT / RESET / categories.
   ========================================================================== */
function renderSettings(root){
  destroyPractice();
  root.replaceChildren();
  root.append(el("div", { class:"song-nav" },
    el("a", { class:"back", href:"#/" },
      el("span",{html:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>'}), "Library")));
  root.append(el("h2", { style:"font-family:var(--serif);font-size:26px;margin-bottom:18px" }, "Settings & data"));

  const songs = Store.getSongs();

  // -- data
  const dataSec = el("div", { class:"settings-sec" });
  dataSec.append(el("h3", {}, "Library data"),
    el("p", {}, `${songs.length} songs · ${songs.filter(s=>s.favorite).length} favorites · stored in this browser (localStorage).`));
  const dataRow = el("div", { class:"row" });
  dataRow.append(el("button", { class:"btn", onclick:exportLibrary }, "Export Library (JSON)"));
  const importInput = el("input", { type:"file", accept:"application/json,.json", style:"display:none",
    onchange:e => { const f = e.target.files[0]; if (f) importLibrary(f); e.target.value = ""; } });
  dataRow.append(el("button", { class:"btn", onclick:() => importInput.click() }, "Import Library (JSON)"), importInput);
  dataRow.append(el("button", { class:"btn danger-btn", onclick:confirmReset }, "Reset my changes"));
  dataSec.append(dataRow);
  root.append(dataSec);

  // -- categories
  const catSec = el("div", { class:"settings-sec" });
  catSec.append(el("h3", {}, "Categories"), el("p", {}, "Used across the library and the Add / Edit form."));
  const catList = el("div", { class:"cat-list" });
  const paintCats = () => { catList.replaceChildren();
    Store.getCategories().forEach(c => {
      const inUse = songs.some(s => s.category === c);
      catList.append(el("span", { class:"pill" }, c,
        el("button", { title: inUse ? "In use — reassign those songs first" : "Remove", disabled: inUse,
          onclick:() => { Store.deleteCategory(c); paintCats(); } }, "×")));
    });
  };
  paintCats();
  const catAdd = el("input", { type:"text", placeholder:"New category", style:"padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)" });
  catAdd.addEventListener("keydown", e => { if (e.key === "Enter" && catAdd.value.trim()){ Store.addCategory(catAdd.value.trim()); catAdd.value = ""; paintCats(); } });
  catSec.append(catList, el("div", { class:"row" }, catAdd,
    el("button", { class:"btn sm", onclick:() => { if (catAdd.value.trim()){ Store.addCategory(catAdd.value.trim()); catAdd.value=""; paintCats(); } } }, "Add")));
  root.append(catSec);

  // -- shortcuts
  const kbSec = el("div", { class:"settings-sec" });
  kbSec.append(el("h3", {}, "Keyboard shortcuts"));
  const kb = el("div", { class:"src-note" });
  [["/","Focus search"],["Esc","Close dialog / leave practice"],
   ["← →","Previous / next song in practice mode"],
   ["F","Favorite the open song"]]
    .forEach(([k,d]) => kb.append(el("div", { style:"margin-bottom:5px" }, el("span", { class:"kbd" }, k), "  " + d)));
  kbSec.append(kb);
  root.append(kbSec);
}

function exportLibrary(){
  const blob = new Blob([JSON.stringify(Store.exportAll(), null, 2)], { type:"application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: `my-music-${new Date().toISOString().slice(0,10)}.json` });
  document.body.append(a); a.click(); a.remove();
  toast("Library exported");
}
function importLibrary(file){
  const reader = new FileReader();
  reader.onload = () => {
    let obj; try { obj = JSON.parse(reader.result); } catch(e){ toast("That file isn’t valid JSON"); return; }
    const songs = obj.songs || (Array.isArray(obj) ? obj : null);
    if (!songs){ toast("No songs found in that file"); return; }
    modal({ title:"Import library", body: el("div", {},
        el("p", {}, `Found ${songs.length} songs in “${esc(file.name)}”.`),
        el("p", { style:"margin-top:8px;color:var(--muted);font-size:13px" }, "Merge keeps your current songs and adds/updates by id. Replace swaps everything.")),
      footer: [
        el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"),
        el("button", { class:"btn", onclick:() => { const n = Store.importAll(obj.songs?obj:{songs}, "merge"); closeModal(); toast(`Merged — ${n} songs`); render(); } }, "Merge"),
        el("button", { class:"btn primary", onclick:() => { const n = Store.importAll(obj.songs?obj:{songs}, "replace"); closeModal(); toast(`Replaced — ${n} songs`); render(); } }, "Replace all"),
      ] });
  };
  reader.readAsText(file);
}
function confirmReset(){
  modal({ title:"Reset my changes", body:
      el("p", {}, "This removes the songs you added in this browser, your edits, favorites and deletions. The library goes back to exactly the songs published with the app. Export a backup first if you want to keep anything."),
    footer: [
      el("button", { class:"btn", onclick:() => closeModal() }, "Cancel"),
      el("button", { class:"btn danger-btn", onclick:() => { Store.resetLibrary(); closeModal(); toast("Back to the published library"); go("#/"); render(); } }, "Reset"),
    ] });
}

/* ==========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================== */
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  const route = parseHash();

  if (e.key === "Escape"){
    if (_chordPop) return closeChordPop();
    if ($("#modal-root").hasChildNodes()) return closeModal();
    if (route.name === "practice") return closePractice();
  }
  if (typing){
    if (e.key === "Escape") document.activeElement.blur();
    return;
  }
  if (e.key === "/"){ e.preventDefault(); $("#search").focus(); $("#search").select(); return; }
  if ($("#modal-root").hasChildNodes()) return;

  if (route.name === "practice" && _practice){
    if (e.key === "ArrowRight"){ e.preventDefault(); _practice.step(1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); _practice.step(-1); }
    if (e.key.toLowerCase() === "f"){ Store.toggleFavorite(_practice.song.id); toast("Favorite toggled"); }
  }
  if (route.name === "song"){
    if (e.key.toLowerCase() === "f"){ Store.toggleFavorite(route.param); render(); }
  }
});

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
$("#search").addEventListener("input", debounce(e => {
  State.q = e.target.value;
  if (parseHash().name !== "library"){ go("#/"); }
  else renderLibrary($("#view"));
}, 140));
$("#search").addEventListener("keydown", e => { if (e.key === "Enter" && parseHash().name !== "library") go("#/"); });
$("#add-btn").addEventListener("click", () => openSongForm(null));
$("#settings-btn").addEventListener("click", () => go("#/settings"));
$("#brand").addEventListener("click", () => go("#/"));
$("#brand").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go("#/"); } });

// first run: seed the store
Store.savePreferences({}); // ensure prefs object exists

render();
</script>
</body>
